<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teoshebo Tools</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg: #0b0b12;
        --card: #14141e;
        --card-hover: #181826;
        --border: #24243a;
        --border-hover: #4a4aff;
        --text: #e4e4ef;
        --text-dim: #8b8ba7;
        --accent: #6c5cff;
        --accent-2: #4a8fff;
    }

    html { scroll-behavior: smooth; }

    body {
        background: var(--bg);
        font-family: 'Inter', 'Segoe UI', sans-serif;
        color: var(--text);
        min-height: 100vh;
        padding: 48px 20px 64px;
        background-image:
            radial-gradient(circle at 20% 30%, rgba(60, 40, 120, 0.18) 0%, transparent 60%),
            radial-gradient(circle at 80% 70%, rgba(40, 80, 160, 0.12) 0%, transparent 50%);
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
    }

    /* ===== ЗАГОЛОВОК ===== */
    .hub-header {
        text-align: center;
        max-width: 720px;
        margin: 0 auto 40px;
    }

    .hub-header h1 {
        font-size: clamp(28px, 5vw, 42px);
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #ffffff 0%, #a8a8d0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 12px;
    }

    .hub-header .subtitle {
        color: var(--text-dim);
        font-size: 16px;
        line-height: 1.5;
    }

    /* ===== ПАНЕЛЬ УПРАВЛЕНИЯ ===== */
    .controls {
        max-width: 1080px;
        margin: 0 auto 40px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
    }

    .search-box {
        position: relative;
        flex: 1 1 260px;
        max-width: 360px;
    }

    .search-box input {
        width: 100%;
        padding: 12px 16px 12px 42px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box input::placeholder { color: var(--text-dim); }

    .search-box input:focus {
        border-color: var(--border-hover);
        box-shadow: 0 0 0 3px rgba(108, 92, 255, 0.15);
    }

    .search-box::before {
        content: "🔍";
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 14px;
        opacity: 0.6;
        pointer-events: none;
    }

    .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .filter-btn {
        padding: 9px 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text-dim);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.18s ease;
    }

    .filter-btn:hover {
        color: var(--text);
        border-color: var(--border-hover);
    }

    .filter-btn.active {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #ffffff;
        border-color: transparent;
        box-shadow: 0 4px 14px rgba(108, 92, 255, 0.3);
    }

    /* ===== СЕКЦИИ ===== */
    .section {
        max-width: 1080px;
        margin: 0 auto 48px;
    }

    .section.hidden { display: none; }

    .section-title {
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-dim);
        margin-bottom: 20px;
        padding-left: 4px;
    }

    /* ===== СЕТКА ===== */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
    }

    .grid-featured {
        grid-template-columns: repeat(3, 1fr);
    }

    @media (max-width: 780px) {
        .grid-featured { grid-template-columns: 1fr; }
    }

    /* ===== КАРТОЧКИ ===== */
    .tool-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
        position: relative;
        overflow: hidden;
    }

    .tool-card.hidden { display: none; }

    .tool-card:not(.empty) { cursor: pointer; }

    .tool-card:not(.empty):hover {
        transform: translateY(-4px);
        border-color: var(--border-hover);
        background: var(--card-hover);
        box-shadow: 0 16px 40px rgba(80, 60, 200, 0.22);
    }

    .tool-card.featured::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        opacity: 0.9;
    }

    .tool-card.perchance::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, #ff5a8e, #ff9d5c);
        opacity: 0.9;
    }

    .tool-icon {
        font-size: 30px;
        line-height: 1;
    }

    .tool-card h3 {
        font-size: 18px;
        font-weight: 600;
        color: #ffffff;
    }

    .tool-card .desc {
        font-size: 14px;
        color: var(--text-dim);
        line-height: 1.5;
        flex-grow: 1;
    }

    /* ===== КНОПКИ ===== */
    .tool-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 9px 14px;
        border-radius: 10px;
        text-decoration: none;
        border: 1px solid transparent;
        transition: all 0.18s ease;
        white-space: nowrap;
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(108, 92, 255, 0.
