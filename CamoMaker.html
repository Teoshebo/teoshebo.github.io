<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless Camo Generator v10.2 (Auto-Names Download)</title>
    <style>
        :root {
            --bg: #121216; --panel: #1e1e24; --text: #e0e0e0;
            --accent: #4caf50; --accent-hover: #45a049;
            --border: #333; --input-bg: #2a2a35;
            --btn-random: #ff9800; --btn-random-hover: #e68a00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg); color: var(--text);
            display: flex; height: 100vh; overflow: hidden;
        }
        
        .sidebar {
            width: 380px; background-color: var(--panel); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; height: 100%;
        }
        .tabs { display: flex; background: #111; border-bottom: 1px solid var(--border); }
        .tab-btn {
            flex: 1; padding: 12px 5px; background: none; border: none; color: #888;
            cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.8rem;
            transition: 0.2s; border-bottom: 2px solid transparent;
        }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        
        .tab-content { display: none; flex: 1; overflow-y: auto; padding: 15px; }
        .tab-content.active { display: block; }

        .control-group { display: flex; flex-direction: column; margin-bottom: 12px; }
        .control-group label { font-size: 0.8rem; margin-bottom: 4px; color: #ccc; display: flex; justify-content: space-between; }
        input[type="range"], input[type="text"], input[type="number"], select, input[type="color"] { width: 100%; padding: 6px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; }
        input[type="color"] { height: 32px; cursor: pointer; padding: 2px; }
        button { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.85rem;}
        button:hover { background: var(--accent-hover); }
        button.danger { background: #d32f2f; }
        button.danger:hover { background: #b71c1c; }
        button.secondary { background: #444; }
        button.secondary:hover { background: #555; }
        button.random { background: var(--btn-random); }
        button.random:hover { background: var(--btn-random-hover); }
        
        .flex-row { display: flex; gap: 5px; }
        .flex-row > * { flex: 1; }

        .layer-item { background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
        .layer-item.active { border-color: var(--accent); }
        .layer-header { display: flex; justify-content: space-between; align-items: center; padding: 10px; cursor: pointer; background: rgba(0,0,0,0.2); }
        .layer-controls { display: none; padding: 10px; border-top: 1px solid var(--border); }
        .layer-item.active .layer-controls { display: block; }
        
        .section-subtitle { font-size: 0.75rem; color: #777; margin: 10px 0 5px 0; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 2px; }

        .main-area {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 20px; background: #0a0a0c; position: relative;
        }
        .canvas-wrapper { position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.8); border: 1px solid #333; }
        canvas#preview-canvas { display: block; width: 512px; height: 512px; }
        
        .seamless-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; opacity: 0; transition: opacity 0.3s;}
        .seamless-grid.show { opacity: 1; }
        .seamless-grid > div { border: 1px dashed rgba(255,255,255,0.2); background-size: cover; background-position: center; }
        
        .actions { margin-top: 20px; display: flex; gap: 10px; }
        .json-area { margin-top: 15px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 4px; border: 1px dashed #444;}
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('global')">Глобально</button>
            <button class="tab-btn" onclick="switchTab('layers')">Слои</button>
            <button class="tab-btn" onclick="switchTab('presets')">Пресеты</button>
        </div>

        <div id="tab-global" class="tab-content active">
            <div class="control-group">
                <label>Размер экспорта</label>
                <select id="global-size">
                    <option value="1024" selected>1024 x 1024</option>
                    <option value="2048">2048 x 2048</option>
                    <option value="4096">4096 x 4096</option>
                </select>
            </div>
            <div class="control-group">
                <label>Цвет фона</label>
                <input type="color" id="global-bg" value="#121816">
            </div>
            <div class="control-group">
                <label>Глобальный сид</label>
                <div class="flex-row">
                    <input type="number" id="global-seed" value="12345">
                    <button onclick="regenerateSeed()">🎲</button>
                </div>
            </div>
            <div class="control-group" style="margin-top: 20px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="check-seamless" onchange="toggleSeamlessView()" style="width: auto;"> 
                    Проверка бесшовности (3x3)
                </label>
            </div>
            <button id="btn-generate" style="width: 100%; margin-top: 10px;">ПЕРЕРИСОВАТЬ ТЕКСТУРУ</button>
            <button id="btn-random" class="random" style="width: 100%; margin-top: 10px;">СЛУЧАЙНЫЙ КАМУФЛЯЖ</button>
        </div>

        <div id="tab-layers" class="tab-content">
            <div class="flex-row" style="margin-bottom: 10px;">
                <button onclick="addLayer()">+ Добавить слой</button>
            </div>
            <div id="layers-container"></div>
        </div>

        <div id="tab-presets" class="tab-content">
            <div class="control-group">
                <label>Имя нового пресета (Авто-генерация)</label>
                <div class="flex-row">
                    <input type="text" id="preset-name" placeholder="Оставьте пустым для авто...">
                    <button onclick="saveCurrentPreset()">💾 Сохр.</button>
                </div>
            </div>
            <div class="json-area">
                <div class="section-subtitle">Библиотека JSON</div>
                <div class="flex-row" style="margin-top: 5px;">
                    <button class="secondary" onclick="exportPresetsJSON()">Экспорт</button>
                    <button class="secondary" onclick="document.getElementById('import-json').click()">Импорт</button>
                    <input type="file" id="import-json" accept=".json" onchange="importPresetsJSON(event)" style="display: none;">
                </div>
            </div>
            <div class="section-subtitle" style="margin-top: 20px;">Сохраненные (<span id="preset-count">0</span>/30)</div>
            <div id="preset-list"></div>
        </div>
    </div>

    <div class="main-area">
        <div class="canvas-wrapper">
            <canvas id="preview-canvas" width="512" height="512"></canvas>
            <div id="seamless-grid" class="seamless-grid"></div>
        </div>
        <div class="actions">
            <button id="btn-download" style="padding: 12px 24px; font-size: 1rem;">Скачать PNG (Высокое разрешение)</button>
        </div>
    </div>

    <script>
        const PREVIEW_SIZE = 512;
        const BASE_RES = 1024;

        let state = {
            width: 1024, height: 1024, bgColor: '#121816', globalSeed: 12345,
            layers: []
        };
        let activeLayerId = null;
        let presets = [];

        // --- МАССИВЫ ДЛЯ АВТО-ИМЕН (32+ элемента) ---
        const colorThemes = [
            "forest", "urban", "desert", "arctic", "ocean", "jungle", "swamp", "canyon",
            "mountain", "meadow", "tundra", "savanna", "volcanic", "coastal", "river", "steppe",
            "taiga", "boreal", "tropical", "alpine", "marsh", "dune", "reef", "glacier",
            "mangrove", "rainforest", "highland", "lowland", "underground", "sky", "cave", "plateau"
        ];

        const patternNames = [
            "brush", "drybrush", "smooth", "wavy", "tiger", "cellular", "voronoi", "pixel",
            "digital", "speckle", "dust", "shards", "crystal", "hex", "honeycomb", "branches",
            "tangle", "rain", "drizzle", "splatter", "splashes", "stencil", "mesh", "web",
            "crack", "fracture", "blob", "spot", "dapple", "mottle", "patch", "swirl"
        ];

        // --- НАСТОЯЩИЙ ШУМ ПЕРЛИНА / ВОРОНОГО ---
        function hash(x, y, seed) {
            let h = x * 374761393 + y * 668265263 + seed * 1442695040888963407;
            h = (h ^ (h >> 13)) * 1274126177;
            return ((h ^ (h >> 16)) >>> 0) / 4294967296;
        }

        function valueNoise2D(x, y, seed) {
            const xi = Math.floor(x), yi = Math.floor(y);
            const xf = x - xi, yf = y - yi;
            const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
            const a = hash(xi, yi, seed);
            const b = hash(xi + 1, yi, seed);
            const c = hash(xi, yi + 1, seed);
            const d = hash(xi + 1, yi + 1, seed);
            return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
        }

        function fbm(x, y, seed) {
            let n = 0, amp = 0.5, freq = 1.0;
            for (let i = 0; i < 4; i++) {
                n += amp * valueNoise2D(x * freq, y * freq, seed + i);
                amp *= 0.5;
                freq *= 2.0;
            }
            return n;
        }

        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // --- UI LOGIC ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        function toggleSeamlessView() {
            const grid = document.getElementById('seamless-grid');
            if (document.getElementById('check-seamless').checked) {
                grid.classList.add('show');
                const dataUrl = document.getElementById('preview-canvas').toDataURL();
                grid.innerHTML = Array(9).fill(`<div style="background-image: url(${dataUrl});"></div>`).join('');
            } else {
                grid.classList.remove('show');
            }
        }

        function regenerateSeed() {
            state.globalSeed = Math.floor(Math.random() * 99999);
            document.getElementById('global-seed').value = state.globalSeed;
            generateTexture();
        }

        function renderLayersUI() {
            const container = document.getElementById('layers-container');
            container.innerHTML = '';
            
            state.layers.forEach((layer, index) => {
                const el = document.createElement('div');
                el.className = `layer-item ${layer.id === activeLayerId ? 'active' : ''}`;
                const isCustom = layer.type === 'custom';
                
                el.innerHTML = `
                    <div class="layer-header" onclick="setActiveLayer(${layer.id})">
                        <strong>Слой ${index + 1} (${layer.type})</strong>
                        <div style="display:flex; gap:5px;">
                            ${index > 0 ? `<button class="secondary" onclick="moveLayer(${index}, -1); event.stopPropagation();">↑</button>` : ''}
                            ${index < state.layers.length - 1 ? `<button class="secondary" onclick="moveLayer(${index}, 1); event.stopPropagation();">↓</button>` : ''}
                            ${state.layers.length > 1 ? `<button class="danger" onclick="removeLayer(${layer.id}); event.stopPropagation();">x</button>` : ''}
                        </div>
                    </div>
                    <div class="layer-controls">
                        <div class="section-subtitle">Основные</div>
                        <div class="control-group">
                            <label>Тип пятен</label>
                            <select onchange="updateLayer(${layer.id}, 'type', this.value)">
                                <option value="brush" ${layer.type === 'brush' ? 'selected' : ''}>Сухая кисть (Органика)</option>
                                <option value="smooth" ${layer.type === 'smooth' ? 'selected' : ''}>Гладкие (Кляксы)</option>
                                <option value="wavy" ${layer.type === 'wavy' ? 'selected' : ''}>Волнистые (Тигр)</option>
                                <option value="cellular" ${layer.type === 'cellular' ? 'selected' : ''}>Ячеистые (Voronoi)</option>
                                <option value="pixel" ${layer.type === 'pixel' ? 'selected' : ''}>Пиксельные (Цифра)</option>
                                <option value="speckle" ${layer.type === 'speckle' ? 'selected' : ''}>Мелкая крапа</option>
                                <option value="shards" ${layer.type === 'shards' ? 'selected' : ''}>Острые (Граненые)</option>
                                <option value="hex" ${layer.type === 'hex' ? 'selected' : ''}>Соты (Гексы)</option>
                                <option value="branches" ${layer.type === 'branches' ? 'selected' : ''}>Ветки (Перехлест)</option>
                                <option value="rain" ${layer.type === 'rain' ? 'selected' : ''}>Дождь (Штрихи)</option>
                                <option value="drybrush" ${layer.type === 'drybrush' ? 'selected' : ''}>Сухая кисть (Направленная)</option>
                                <option value="splatter" ${layer.type === 'splatter' ? 'selected' : ''}>Брызги (Кластеры)</option>
                                <option value="custom" ${layer.type === 'custom' ? 'selected' : ''}>Свой PNG</option>
                            </select>
                        </div>
                        ${isCustom ? `<div class="control-group"><input type="file" accept="image/png" onchange="uploadPattern(${layer.id}, this)"></div>` : ''}
                        
                        <div class="control-group">
                            <label>Палитра (Случайный выбор)</label>
                            <div class="flex-row">
                                ${layer.palette.map((c, i) => `<input type="color" value="${c}" onchange="updatePaletteColor(${layer.id}, ${i}, this.value)">`).join('')}
                            </div>
                        </div>

                        <div class="section-subtitle">Генерация</div>
                        <div class="control-group">
                            <label>Сид слоя: ${layer.seed}</label>
                            <div class="flex-row">
                                <input type="number" value="${layer.seed}" onchange="updateLayer(${layer.id}, 'seed', parseInt(this.value))">
                                <button onclick="randomizeLayerSeed(${layer.id})">🎲</button>
                            </div>
                        </div>
                        <div class="control-group">
                            <label>Плотность (кол-во): ${layer.density}</label>
                            <input type="range" min="5" max="100" value="${layer.density}" oninput="updateLayer(${layer.id}, 'density', parseInt(this.value), this)">
                        </div>
                        <div class="control-group">
                            <label>Разброс размера: ${layer.sizeJitter}%</label>
                            <input type="range" min="0" max="100" value="${layer.sizeJitter}" oninput="updateLayer(${layer.id}, 'sizeJitter', parseInt(this.value), this)">
                        </div>
                        <div class="flex-row">
                            <div class="control-group">
                                <label>Мин. расст.</label>
                                <input type="range" min="0" max="200" value="${layer.minDist}" oninput="updateLayer(${layer.id}, 'minDist', parseInt(this.value), this)">
                            </div>
                            <div class="control-group">
                                <label>Макс. расст.</label>
                                <input type="range" min="100" max="1000" value="${layer.maxDist}" oninput="updateLayer(${layer.id}, 'maxDist', parseInt(this.value), this)">
                            </div>
                        </div>

                        <div class="section-subtitle">Шум и Трансформация</div>
                        <div class="control-group">
                            <label>Тип шума</label>
                            <select onchange="updateLayer(${layer.id}, 'noiseType', this.value)">
                                <option value="perlin" ${layer.noiseType === 'perlin' ? 'selected' : ''}>Perlin (Органика)</option>
                                <option value="voronoi" ${layer.noiseType === 'voronoi' ? 'selected' : ''}>Voronoi (Границы)</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label>Эрозия (Матовое стекло): ${layer.noise}%</label>
                            <input type="range" min="0" max="100" value="${layer.noise}" oninput="updateLayer(${layer.id}, 'noise', parseInt(this.value), this)">
                        </div>
                        <div class="control-group">
                            <label>Шум пигмента: ±${layer.colorNoise}%</label>
                            <input type="range" min="0" max="50" value="${layer.colorNoise}" oninput="updateLayer(${layer.id}, 'colorNoise', parseInt(this.value), this)">
                        </div>
                        
                        <div class="flex-row">
                            <div class="control-group"><label>Масштаб</label><input type="range" min="0.1" max="3" step="0.1" value="${layer.scale}" oninput="updateLayer(${layer.id}, 'scale', parseFloat(this.value), this)"></div>
                            <div class="control-group"><label>Поворот</label><input type="range" min="0" max="360" value="${layer.rotation}" oninput="updateLayer(${layer.id}, 'rotation', parseInt(this.value), this)"></div>
                        </div>
                        <div class="flex-row">
                            <div class="control-group"><label>Сжатие X</label><input type="range" min="0.1" max="3" step="0.1" value="${layer.scaleX}" oninput="updateLayer(${layer.id}, 'scaleX', parseFloat(this.value), this)"></div>
                            <div class="control-group"><label>Сжатие Y</label><input type="range" min="0.1" max="3" step="0.1" value="${layer.scaleY}" oninput="updateLayer(${layer.id}, 'scaleY', parseFloat(this.value), this)"></div>
                        </div>
                        
                        <div class="section-subtitle">Наложение</div>
                        <div class="control-group">
                            <select onchange="updateLayer(${layer.id}, 'blend', this.value)">
                                <option value="source-over" ${layer.blend === 'source-over' ? 'selected' : ''}>Обычный</option>
                                <option value="multiply" ${layer.blend === 'multiply' ? 'selected' : ''}>Умножение</option>
                                <option value="overlay" ${layer.blend === 'overlay' ? 'selected' : ''}>Перекрытие</option>
                                <option value="screen" ${layer.blend === 'screen' ? 'selected' : ''}>Экран</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label>Прозрачность: ${Math.round(layer.opacity * 100)}%</label>
                            <input type="range" min="0" max="100" value="${layer.opacity * 100}" oninput="updateLayer(${layer.id}, 'opacity', parseInt(this.value) / 100, this)">
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        window.setActiveLayer = (id) => { activeLayerId = id; renderLayersUI(); }
        
        window.updateLayer = (id, key, val, el) => {
            const layer = state.layers.find(l => l.id === id);
            if (layer) {
                layer[key] = val;
                if (key === 'type') renderLayersUI();
                
                if (el && el.type === 'range') {
                    const label = el.previousElementSibling;
                    if (key === 'density') label.innerHTML = `Плотность (кол-во): ${val}`;
                    if (key === 'sizeJitter') label.innerHTML = `Разброс размера: ${val}%`;
                    if (key === 'noise') label.innerHTML = `Эрозия (Матовое стекло): ${val}%`;
                    if (key === 'colorNoise') label.innerHTML = `Шум пигмента: ±${val}%`;
                    if (key === 'opacity') label.innerHTML = `Прозрачность: ${Math.round(val * 100)}%`;
                }
                
                clearTimeout(window.debounce);
                window.debounce = setTimeout(generateTexture, 50);
            }
        }

        window.updatePaletteColor = (id, index, color) => {
            const layer = state.layers.find(l => l.id === id);
            if (layer) {
                layer.palette[index] = color;
                clearTimeout(window.debounce);
                window.debounce = setTimeout(generateTexture, 50);
            }
        }

        window.randomizeLayerSeed = (id) => {
            const layer = state.layers.find(l => l.id === id);
            if (layer) {
                layer.seed = Math.floor(Math.random() * 99999);
                renderLayersUI();
                generateTexture();
            }
        }

        window.addLayer = () => {
            const newId = Date.now();
            state.layers.push({
                id: newId, type: 'smooth', palette: ['#3b4d3a', '#4a5e3a', '#2b3b26'], 
                noise: 10, colorNoise: 10, noiseType: 'perlin', blend: 'multiply', opacity: 0.9,
                seed: Math.floor(Math.random() * 99999), density: 30, sizeJitter: 50, 
                minDist: 50, maxDist: 300, scale: 1, scaleX: 1, scaleY: 1, rotation: 0, image: null, imageSrc: null
            });
            activeLayerId = newId;
            renderLayersUI();
            generateTexture();
        }

        window.removeLayer = (id) => {
            state.layers = state.layers.filter(l => l.id !== id);
            if (activeLayerId === id && state.layers.length > 0) activeLayerId = state.layers[0].id;
            renderLayersUI();
            generateTexture();
        }

        window.moveLayer = (index, dir) => {
            const newIdx = index + dir;
            if (newIdx >= 0 && newIdx < state.layers.length) {
                const temp = state.layers[index];
                state.layers[index] = state.layers[newIdx];
                state.layers[newIdx] = temp;
                renderLayersUI();
                generateTexture();
            }
        }

        // --- RANDOMIZER ---
        window.generateRandomCamo = () => {
            const palettes = [
                ['#2b3b26', '#4a5e3a', '#1a2415', '#5e6e47', '#2e3b22'],
                ['#b59e74', '#8c7a54', '#d9c7a7', '#5a4d36', '#6d5f45'],
                ['#2f2f2f', '#474747', '#121212', '#636363', '#1f1f1f'],
                ['#e0e0e0', '#a0a0a0', '#ffffff', '#555555', '#7a7a7a'],
                ['#6b1d1d', '#9c3030', '#3d0a0a', '#c94a4a', '#822020'],
                ['#1a2b3c', '#2d4a63', '#0f1821', '#3e6b8a', '#1e3348']
            ];

            const types = ['brush', 'smooth', 'wavy', 'cellular', 'pixel', 'speckle', 'shards', 'hex', 'branches', 'rain', 'drybrush', 'splatter'];
            const blends = ['source-over', 'multiply', 'overlay', 'screen'];
            const noiseTypes = ['perlin', 'voronoi'];

            const palette = palettes[Math.floor(Math.random() * palettes.length)];
            
            state.bgColor = palette[Math.floor(Math.random() * palette.length)];
            document.getElementById('global-bg').value = state.bgColor;
            state.globalSeed = Math.floor(Math.random() * 99999);
            document.getElementById('global-seed').value = state.globalSeed;

            const numLayers = Math.floor(Math.random() * 4) + 2;
            state.layers = [];

            for (let i = 0; i < numLayers; i++) {
                const layerPalette = [
                    palette[Math.floor(Math.random() * palette.length)],
                    palette[Math.floor(Math.random() * palette.length)],
                    palette[Math.floor(Math.random() * palette.length)]
                ];

                const minDist = Math.floor(Math.random() * 50) + 20;
                const maxDist = minDist + Math.floor(Math.random() * 300) + 100;

                state.layers.push({
                    id: Date.now() + i,
                    type: types[Math.floor(Math.random() * types.length)],
                    palette: layerPalette,
                    noise: Math.floor(Math.random() * 20) + 5,
                    colorNoise: Math.floor(Math.random() * 15) + 5,
                    noiseType: noiseTypes[Math.floor(Math.random() * noiseTypes.length)],
                    blend: i === 0 ? 'source-over' : blends[Math.floor(Math.random() * blends.length)],
                    opacity: Math.random() * 0.4 + 0.6,
                    seed: Math.floor(Math.random() * 99999),
                    density: Math.floor(Math.random() * 30) + 15,
                    sizeJitter: Math.floor(Math.random() * 60) + 10,
                    minDist: minDist,
                    maxDist: maxDist,
                    scale: Math.random() * 1.0 + 0.5,
                    scaleX: Math.random() * 1.0 + 0.5,
                    scaleY: Math.random() * 1.0 + 0.5,
                    rotation: Math.floor(Math.random() * 360),
                    image: null, imageSrc: null
                });
            }

            activeLayerId = state.layers[0].id;
            renderLayersUI();
            generateTexture();
        }

        // --- RENDER ENGINE ---
        function renderToCanvas(targetCtx, w, h) {
            targetCtx.fillStyle = state.bgColor;
            targetCtx.fillRect(0, 0, w, h);
            
            state.layers.forEach((layer) => {
                const layerCanvas = document.createElement('canvas');
                layerCanvas.width = w; layerCanvas.height = h;
                const lCtx = layerCanvas.getContext('2d', { willReadFrequently: true });
                
                drawBlobs(lCtx, layer, w, h);
                applyNoiseAndPigment(lCtx, layer, w, h);
                
                targetCtx.globalAlpha = layer.opacity;
                targetCtx.globalCompositeOperation = layer.blend;
                targetCtx.drawImage(layerCanvas, 0, 0);
            });
            
            targetCtx.globalAlpha = 1.0;
            targetCtx.globalCompositeOperation = 'source-over';
        }

        function drawBlobs(ctx, layer, w, h) {
            const prng = mulberry32(Number(layer.seed) + Number(state.globalSeed));
            const baseRadius = Math.min(w, h) * 0.08;
            const points = [];
            
            let attempts = 0;
            const maxAttempts = layer.density * 50;
            
            while(points.length < layer.density && attempts < maxAttempts) {
                attempts++;
                const px = prng() * w;
                const py = prng() * h;
                
                let valid = true;
                for (let p of points) {
                    let dx = Math.abs(px - p.x);
                    let dy = Math.abs(py - p.y);
                    if (dx > w/2) dx = w - dx;
                    if (dy > h/2) dy = h - dy;
                    
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < layer.minDist) {
                        valid = false; break;
                    }
                }
                
                if (valid) points.push({ x: px, y: py });
            }

            if (points.length === 0) {
                for (let i = 0; i < layer.density; i++) {
                    points.push({ x: prng() * w, y: prng() * h });
                }
            }

            points.forEach(p => {
                const color = layer.palette[Math.floor(prng() * layer.palette.length)] || '#000000';
                ctx.fillStyle = color;
                ctx.strokeStyle = color;
                
                const jitter = (prng() * 2 - 1) * (layer.sizeJitter / 100);
                const radius = baseRadius * (1 + jitter);
                const blobSeed = prng() * 100;
                
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        ctx.save();
                        ctx.translate(p.x + dx * w, p.y + dy * h);
                        ctx.rotate(layer.rotation * Math.PI / 180);
                        ctx.scale(layer.scale * (layer.scaleX || 1), layer.scale * (layer.scaleY || 1));
                        
                        if (layer.type === 'custom' && layer.image) {
                            const imgScale = (w / BASE_RES);
                            const dw = layer.image.width * imgScale;
                            const dh = layer.image.height * imgScale;
                            ctx.drawImage(layer.image, -dw/2, -dh/2, dw, dh);
                        } else {
                            drawShape(ctx, radius, blobSeed, layer.type, w);
                        }
                        ctx.restore();
                    }
                }
            });
        }

        function drawShape(ctx, radius, seed, type, canvasWidth) {
            const resScale = canvasWidth / BASE_RES;
            ctx.beginPath();
            
            if (type === 'wavy') {
                ctx.lineWidth = radius * 0.5;
                ctx.lineCap = 'round';
                const length = radius * 4;
                for (let i = 0; i <= 20; i++) {
                    const px = (i / 20 - 0.5) * length;
                    const py = (mulberry32(seed + i)() - 0.5) * radius * 1.5;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
            else if (type === 'cellular') {
                for (let i = 0; i <= 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const r = radius * (0.8 + mulberry32(seed + i)() * 0.4);
                    const px = Math.cos(angle) * r;
                    const py = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.lineWidth = 2 * resScale;
                ctx.stroke();
            }
            else if (type === 'pixel') {
                const grid = 8 * resScale;
                const cx = Math.floor(radius / grid);
                for (let x = -cx; x <= cx; x++) {
                    for (let y = -cx; y <= cx; y++) {
                        if (mulberry32(seed + x * 100 + y)() > 0.3) {
                            ctx.fillRect(x * grid, y * grid, grid, grid);
                        }
                    }
                }
            }
            else if (type === 'speckle') {
                for (let i = 0; i < 20; i++) {
                    const px = (mulberry32(seed + i)() - 0.5) * radius * 1.5;
                    const py = (mulberry32(seed + i + 10)() - 0.5) * radius * 1.5;
                    const r = 2 * resScale;
                    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.fill();
                }
            }
            else if (type === 'shards') {
                const pts = 6 + Math.floor(mulberry32(seed)() * 4);
                for (let i = 0; i <= pts; i++) {
                    const angle = (i / pts) * Math.PI * 2;
                    const r = radius * (mulberry32(seed + i)() * 0.8 + 0.2); 
                    const px = Math.cos(angle) * r;
                    const py = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
            }
            else if (type === 'hex') {
                for (let i = 0; i <= 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 + (Math.PI / 6);
                    const px = Math.cos(angle) * radius;
                    const py = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.lineWidth = 1 * resScale;
                ctx.stroke();
            }
            else if (type === 'branches') {
                ctx.lineWidth = radius * 0.4;
                ctx.lineCap = 'round';
                const numBranches = 4;
                for (let i = 0; i < numBranches; i++) {
                    const angle = mulberry32(seed + i)() * Math.PI * 2;
                    const length = radius * (1 + mulberry32(seed + i + 10)());
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angle) * length, Math.sin(angle) * length);
                    ctx.stroke();
                }
            }
            else if (type === 'rain') {
                ctx.lineWidth = radius * 0.1;
                ctx.lineCap = 'round';
                const numDrops = 8;
                for (let i = 0; i < numDrops; i++) {
                    const px = (mulberry32(seed + i)() - 0.5) * radius * 2;
                    const py = (mulberry32(seed + i + 10)() - 0.5) * radius * 2;
                    const len = radius * (0.5 + mulberry32(seed + i + 20)());
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(px, py + len);
                    ctx.stroke();
                }
            }
            else if (type === 'drybrush') {
                ctx.lineWidth = radius * 0.15;
                ctx.lineCap = 'round';
                for (let i = 0; i < 15; i++) {
                    const angle = (mulberry32(seed + i)() - 0.5) * 0.5;
                    const px = (mulberry32(seed + i + 10)() - 0.5) * radius;
                    const len = radius * (0.5 + mulberry32(seed + i + 20)());
                    ctx.beginPath();
                    ctx.moveTo(px, px);
                    ctx.lineTo(px + Math.cos(angle)*len, px + Math.sin(angle)*len);
                    ctx.stroke();
                }
            }
            else if (type === 'splatter') {
                ctx.arc(0, 0, radius * 0.3, 0, Math.PI * 2); ctx.fill();
                for(let i=0; i<10; i++) {
                    const px = (mulberry32(seed + i)() - 0.5) * radius * 1.8;
                    const py = (mulberry32(seed + i + 10)() - 0.5) * radius * 1.8;
                    ctx.beginPath(); ctx.arc(px, py, 2 * resScale, 0, Math.PI*2); ctx.fill();
                }
            }
            else {
                const pts = type === 'brush' ? 64 : 32;
                const roughness = type === 'brush' ? 1.0 : 0.3;
                for (let i = 0; i <= pts; i++) {
                    const angle = (i / pts) * Math.PI * 2;
                    let n = mulberry32(seed + i)();
                    if (type === 'brush') n = n * 0.7 + mulberry32(seed + i + 100)() * 0.3;
                    const r = radius * (1 + (n - 0.5) * roughness);
                    const px = Math.cos(angle) * r;
                    const py = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.filter = type === 'smooth' ? `blur(${4 * resScale}px)` : 'none';
                ctx.fill();
                ctx.filter = 'none';
            }
        }

        function applyNoiseAndPigment(ctx, layer, w, h) {
            if (layer.noise === 0 && layer.colorNoise === 0) return;

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            const erosionVal = layer.noise / 100;
            const pigmentVal = layer.colorNoise / 100;
            
            const vPoints = [];
            if (layer.noiseType === 'voronoi') {
                const prng = mulberry32(Number(layer.seed) + Number(state.globalSeed));
                for (let i = 0; i < 50; i++) {
                    vPoints.push({ x: prng() * w, y: prng() * h });
                }
            }

            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] === 0) continue; 
                const x = (i / 4) % w;
                const y = Math.floor((i / 4) / w);

                if (pigmentVal > 0) {
                    let cNoise = (fbm(x * 0.01, y * 0.01, layer.seed) - 0.5) * 2;
                    let shift = cNoise * pigmentVal * 100;
                    data[i] = Math.min(255, Math.max(0, data[i] + shift));
                    data[i+1] = Math.min(255, Math.max(0, data[i+1] + shift));
                    data[i+2] = Math.min(255, Math.max(0, data[i+2] + shift));
                }

                if (erosionVal > 0) {
                    let n = 0;
                    if (layer.noiseType === 'perlin') {
                        n = fbm(x * 0.05, y * 0.05, layer.seed);
                    } else {
                        let minDist1 = 999999, minDist2 = 999999;
                        for (let p of vPoints) {
                            let dx = x - p.x;
                            let dy = y - p.y;
                            let dist = dx*dx + dy*dy;
                            if (dist < minDist1) { minDist2 = minDist1; minDist1 = dist; }
                            else if (dist < minDist2) { minDist2 = dist; }
                        }
                        let borderDist = Math.sqrt(minDist2) - Math.sqrt(minDist1);
                        n = Math.min(1, borderDist / (w * 0.05)); 
                    }

                    if (n < erosionVal) {
                        data[i + 3] = 0;
                    } else if (n < erosionVal + 0.1) {
                        data[i + 3] = data[i + 3] * 0.5;
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // --- PRESET & JSON LOGIC ---
        function generatePresetName() {
            const colorPart = colorThemes[Math.floor(Math.random() * colorThemes.length)];
            
            let basePattern = 'smooth';
            if (state.layers.length > 0) {
                basePattern = state.layers[0].type;
            }
            let patternPart = patternNames.find(p => p === basePattern) || 'organic';
            if (Math.random() > 0.5) patternPart += "Mix";

            const hexPart = state.bgColor.replace('#', '');

            return `${colorPart}_${patternPart}_${hexPart}`;
        }

        function saveCurrentPreset() {
            if (presets.length >= 30) return alert("Лимит 30 пресетов.");
            
            let name = document.getElementById('preset-name').value.trim();
            
            if (!name) {
                name = generatePresetName();
                let counter = 1;
                let originalName = name;
                while (presets.some(p => p.name === name)) {
                    name = `${originalName}_v${counter}`;
                    counter++;
                }
            }

            presets.push({ name, data: JSON.parse(JSON.stringify(state)) });
            localStorage.setItem('camo_presets_v10', JSON.stringify(presets));
            document.getElementById('preset-name').value = '';
            renderPresets();
        }

        function renderPresets() {
            document.getElementById('preset-count').innerText = presets.length;
            const list = document.getElementById('preset-list');
            list.innerHTML = presets.map((p, i) => `
                <div class="layer-item" style="display:flex; justify-content:space-between; align-items:center; padding:8px;">
                    <span style="font-size:0.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${p.name}">${p.name}</span>
                    <div style="display:flex; gap:5px;">
                        <button class="secondary" onclick="loadPreset(${i})">Загр</button>
                        <button class="danger" onclick="deletePreset(${i})">X</button>
                    </div>
                </div>
            `).join('');
        }

        window.loadPreset = (i) => {
            state = JSON.parse(JSON.stringify(presets[i].data));
            activeLayerId = state.layers[0]?.id;
            state.layers.forEach(l => {
                if (l.imageSrc) {
                    const img = new Image();
                    img.onload = () => { l.image = img; generateTexture(); };
                    img.src = l.imageSrc;
                }
            });
            document.getElementById('global-size').value = state.width;
            document.getElementById('global-bg').value = state.bgColor;
            document.getElementById('global-seed').value = state.globalSeed;
            renderLayersUI();
            generateTexture();
        }

        window.deletePreset = (i) => {
            presets.splice(i, 1);
            localStorage.setItem('camo_presets_v10', JSON.stringify(presets));
            renderPresets();
        }

        window.exportPresetsJSON = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(presets, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "camo_library.json");
            dlAnchor.click();
        }

        window.importPresetsJSON = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        presets = presets.concat(imported).slice(0, 30);
                        localStorage.setItem('camo_presets_v10', JSON.stringify(presets));
                        renderPresets();
                        alert(`Импортировано пресетов: ${imported.length}`);
                    }
                } catch (err) {
                    alert("Ошибка чтения JSON файла");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // --- INIT & EXPORT ---
        function generateTexture() {
            const pCtx = document.getElementById('preview-canvas').getContext('2d');
            renderToCanvas(pCtx, PREVIEW_SIZE, PREVIEW_SIZE);
            if (document.getElementById('check-seamless').checked) toggleSeamlessView();
        }

        document.getElementById('btn-generate').onclick = generateTexture;
        document.getElementById('btn-random').onclick = generateRandomCamo;
        
        document.getElementById('global-size').onchange = (e) => {
            state.width = parseInt(e.target.value);
            state.height = parseInt(e.target.value);
        }
        document.getElementById('global-bg').oninput = (e) => {
            state.bgColor = e.target.value; generateTexture();
        }
        document.getElementById('global-seed').onchange = (e) => {
            state.globalSeed = parseInt(e.target.value); generateTexture();
        }

        document.getElementById('btn-download').onclick = () => {
            const btn = document.getElementById('btn-download');
            btn.innerText = "Генерация..."; btn.disabled = true;
            
            setTimeout(() => {
                const exCanvas = document.createElement('canvas');
                exCanvas.width = state.width; exCanvas.height = state.height;
                const exCtx = exCanvas.getContext('2d');
                
                renderToCanvas(exCtx, state.width, state.height);
                
                // ИСПОЛЬЗУЕМ СГЕНЕРИРОВАННОЕ ИМЯ ДЛЯ СКАЧИВАНИЯ
                const fileName = `${generatePresetName()}_${state.width}x${state.height}.png`;

                exCanvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; 
                    a.download = fileName; // <--- ПРИМЕНЕНО ЗДЕСЬ
                    a.click();
                    URL.revokeObjectURL(url);
                    btn.innerText = "Скачать PNG (Высокое разрешение)"; btn.disabled = false;
                });
            }, 50);
        }

        const stored = localStorage.getItem('camo_presets_v10');
        if (stored) { try { presets = JSON.parse(stored); } catch(e){} }

        addLayer(); 
        document.getElementById('global-seed').value = state.globalSeed;
        renderPresets();
        generateTexture();
    </script>
</body>
</html>
