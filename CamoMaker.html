<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless Camouflage Generator v7 (PNG Pattern)</title>
    <style>
        :root {
            --bg: #1e1e24; --panel: #2b2b36; --text: #e0e0e0;
            --accent: #4caf50; --accent-hover: #45a049;
            --border: #444; --input-bg: #1a1a20;
            --btn-random: #ff9800; --btn-random-hover: #e68a00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg); color: var(--text);
            display: flex; height: 100vh; overflow: hidden;
        }
        
        /* Sidebar */
        .sidebar {
            width: 420px; background-color: var(--panel); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .header { padding: 15px; border-bottom: 1px solid var(--border); background-color: #222; position: sticky; top: 0; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
        .header h1 { font-size: 1.2rem; }
        
        .btn-row { display: flex; gap: 8px; }
        .btn-row button { flex: 1; }

        .section { padding: 15px; border-bottom: 1px solid var(--border); }
        .section-title { font-weight: bold; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase; color: #aaa; display: flex; justify-content: space-between; align-items: center; }
        
        /* Controls */
        .control-group { display: flex; flex-direction: column; margin-bottom: 8px; }
        .control-group label { font-size: 0.8rem; margin-bottom: 4px; color: #ccc; display: flex; justify-content: space-between; }
        input[type="range"], input[type="text"], select, input[type="color"] { width: 100%; padding: 4px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 4px; }
        input[type="color"] { height: 30px; cursor: pointer; padding: 2px; }
        input[type="file"] { font-size: 0.8rem; color: #ccc; }
        button { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #555; cursor: not-allowed; }
        button.random { background: var(--btn-random); }
        button.random:hover { background: var(--btn-random-hover); }
        button.danger { background: #d32f2f; }
        button.danger:hover { background: #b71c1c; }
        button.small { padding: 4px 8px; font-size: 0.8rem; }

        /* Layer List */
        .layer-item { background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px; margin-bottom: 10px; }
        .layer-item.active { border-color: var(--accent); }
        .layer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; cursor: pointer; padding-bottom: 5px; border-bottom: 1px solid #333; }
        .layer-controls { display: none; margin-top: 10px; }
        .layer-item.active .layer-controls { display: block; }
        .transform-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 4px; }

        /* Canvas Area */
        .main-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: #111; overflow: auto; }
        .canvas-container { background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 1px solid var(--border); position: relative; }
        canvas#preview-canvas { display: block; width: 512px; height: 512px; object-fit: contain; image-rendering: pixelated; }
        .actions { margin-top: 20px; display: flex; gap: 10px; }

        /* Presets */
        .preset-list { max-height: 150px; overflow-y: auto; margin-top: 10px; }
        .preset-item { display: flex; justify-content: space-between; align-items: center; padding: 6px; background: var(--input-bg); border: 1px solid var(--border); margin-bottom: 5px; border-radius: 4px; }
        .preset-name { font-size: 0.8rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
        .preset-actions { display: flex; gap: 5px; }
        
        .file-upload-wrapper {
            background: #2a2a35; padding: 8px; border-radius: 4px; border: 1px dashed #555;
            margin-top: 5px; text-align: center;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="header">
            <h1>Camо Generator v7</h1>
            <div class="btn-row">
                <button id="btn-generate">ОБНОВИТЬ</button>
                <button id="btn-random" class="random">СЛУЧАЙНЫЙ</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Глобальные настройки</div>
            <div class="control-group">
                <label>Размер экспорта (PNG)</label>
                <select id="global-size">
                    <option value="512">512 x 512</option>
                    <option value="1024" selected>1024 x 1024</option>
                    <option value="2048">2048 x 2048</option>
                    <option value="4096">4096 x 4096</option>
                </select>
            </div>
            <div class="control-group">
                <label>Цвет фона</label>
                <input type="color" id="global-bg" value="#121816">
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <span>Пресеты (<span id="preset-count">0</span>/30)</span>
            </div>
            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <input type="text" id="preset-name" placeholder="Имя пресета..." style="flex: 1;">
                <button id="btn-save-preset" class="small">Сохранить</button>
            </div>
            <div class="preset-list" id="preset-list"></div>
        </div>

        <div class="section" style="flex: 1;">
            <div class="section-title">
                <span>Слои</span>
                <button id="btn-add-layer" class="small">+ Добавить</button>
            </div>
            <div id="layers-container"></div>
        </div>
    </div>

    <div class="main-area">
        <div class="canvas-container">
            <canvas id="preview-canvas" width="512" height="512"></canvas>
        </div>
        <div class="actions">
            <button id="btn-download">Скачать PNG (Высокое разрешение)</button>
        </div>
    </div>

    <script>
        const PREVIEW_SIZE = 512;
        const BASE_RES = 1024;
        const STORAGE_KEY = 'camo_presets_universal_v7';

        let state = {
            width: 1024, height: 1024, bgColor: '#121816',
            layers: [
                { id: 1, color: '#3b4d3a', type: 'smooth', noise: 10, colorNoise: 15, blend: 'source-over', opacity: 1.0, seed: Math.random() * 1000, scale: 1, scaleX: 1, scaleY: 1, rotation: 0, image: null, imageSrc: null },
                { id: 2, color: '#1c261d', type: 'brush', noise: 25, colorNoise: 10, blend: 'multiply', opacity: 0.9, seed: Math.random() * 1000, scale: 1, scaleX: 1, scaleY: 1, rotation: 0, image: null, imageSrc: null }
            ]
        };
        let activeLayerId = state.layers[0].id;
        let presets = [];

        const previewCanvas = document.getElementById('preview-canvas');
        const pCtx = previewCanvas.getContext('2d', { willReadFrequently: true });
        const layersContainer = document.getElementById('layers-container');
        const presetList = document.getElementById('preset-list');
        const presetCount = document.getElementById('preset-count');
        const globalBgInput = document.getElementById('global-bg');
        const btnDownload = document.getElementById('btn-download');

        // --- ULTRA FAST NOISE ---
        function fastNoise(x, y, seed) {
            let n = x * 374761393 + y * 668265263 + seed * 1442695040888963407;
            n = (n ^ (n >> 13)) * 1274126177;
            return ((n ^ (n >> 16)) >>> 0) / 4294967296;
        }

        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // --- IMAGE REHYDRATION ---
        // Превращает Base64 строки обратно в объекты Image при загрузке пресета
        function rehydrateImages() {
            state.layers.forEach(layer => {
                if (layer.imageSrc && !layer.image) {
                    const img = new Image();
                    img.src = layer.imageSrc;
                    layer.image = img;
                }
            });
        }

        // --- UI RENDER ---
        function renderLayersUI() {
            layersContainer.innerHTML = '';
            state.layers.forEach((layer, index) => {
                const el = document.createElement('div');
                el.className = `layer-item ${layer.id === activeLayerId ? 'active' : ''}`;
                
                // Показываем загрузку файла только если выбран тип custom
                const isCustom = layer.type === 'custom';
                const customUploadStyle = isCustom ? 'flex' : 'none';

                el.innerHTML = `
                    <div class="layer-header" onclick="setActiveLayer(${layer.id})">
                        <span><strong>Слой ${index + 1}</strong></span>
                        <div style="display:flex; gap:5px;">
                            ${index > 0 ? `<button class="small" onclick="moveLayer(${index}, -1); event.stopPropagation();">↑</button>` : ''}
                            ${index < state.layers.length - 1 ? `<button class="small" onclick="moveLayer(${index}, 1); event.stopPropagation();">↓</button>` : ''}
                            ${state.layers.length > 1 ? `<button class="danger small" onclick="removeLayer(${layer.id}); event.stopPropagation();">x</button>` : ''}
                        </div>
                    </div>
                    <div class="layer-controls">
                        <div class="control-group">
                            <label>Основной цвет (для не-PNG)</label>
                            <input type="color" value="${layer.color}" onchange="updateLayer(${layer.id}, 'color', this.value)">
                        </div>
                        <div class="control-group">
                            <label>Тип пятен</label>
                            <select onchange="updateLayer(${layer.id}, 'type', this.value)">
                                <option value="brush" ${layer.type === 'brush' ? 'selected' : ''}>Сухая кисть / Спрей</option>
                                <option value="smooth" ${layer.type === 'smooth' ? 'selected' : ''}>Гладкие (Кляксы)</option>
                                <option value="circles" ${layer.type === 'circles' ? 'selected' : ''}>Круги</option>
                                <option value="wavy" ${layer.type === 'wavy' ? 'selected' : ''}>Волнистые линии</option>
                                <option value="cellular" ${layer.type === 'cellular' ? 'selected' : ''}>Ячеистые (Соты)</option>
                                <option value="splatter" ${layer.type === 'splatter' ? 'selected' : ''}>Крапчатые</option>
                                <option value="digital" ${layer.type === 'digital' ? 'selected' : ''}>Пиксельные (Цифра)</option>
                                <option value="custom" ${layer.type === 'custom' ? 'selected' : ''}>Пользовательский PNG</option>
                            </select>
                        </div>
                        
                        <!-- Блок загрузки PNG -->
                        <div class="control-group" style="display: ${customUploadStyle};">
                            <div class="file-upload-wrapper">
                                <label style="font-size: 0.75rem; color: #aaa; display: block; margin-bottom: 5px;">Загрузить паттерн (PNG)</label>
                                <input type="file" accept="image/png" onchange="uploadPattern(${layer.id}, this)">
                            </div>
                        </div>

                        <div class="transform-grid">
                            <div class="control-group">
                                <label>Масштаб: ${layer.scale.toFixed(1)}x</label>
                                <input type="range" min="0.1" max="5" step="0.1" value="${layer.scale}" oninput="updateLayer(${layer.id}, 'scale', parseFloat(this.value), this)">
                            </div>
                            <div class="control-group">
                                <label>Поворот: ${Math.round(layer.rotation)}°</label>
                                <input type="range" min="0" max="360" value="${layer.rotation}" oninput="updateLayer(${layer.id}, 'rotation', parseInt(this.value), this)">
                            </div>
                            <div class="control-group">
                                <label>Сжатие X: ${layer.scaleX.toFixed(1)}x</label>
                                <input type="range" min="0.1" max="5" step="0.1" value="${layer.scaleX}" oninput="updateLayer(${layer.id}, 'scaleX', parseFloat(this.value), this)">
                            </div>
                            <div class="control-group">
                                <label>Сжатие Y: ${layer.scaleY.toFixed(1)}x</label>
                                <input type="range" min="0.1" max="5" step="0.1" value="${layer.scaleY}" oninput="updateLayer(${layer.id}, 'scaleY', parseFloat(this.value), this)">
                            </div>
                        </div>

                        <div class="control-group">
                            <label>Шум границ (Эрозия): ${layer.noise}%</label>
                            <input type="range" min="0" max="100" value="${layer.noise}" oninput="updateLayer(${layer.id}, 'noise', parseInt(this.value), this)">
                        </div>
                        <div class="control-group">
                            <label>Шум пигмента (Цвет): ±${layer.colorNoise}%</label>
                            <input type="range" min="0" max="50" value="${layer.colorNoise}" oninput="updateLayer(${layer.id}, 'colorNoise', parseInt(this.value), this)">
                        </div>
                        <div class="control-group">
                            <label>Режим наложения</label>
                            <select onchange="updateLayer(${layer.id}, 'blend', this.value)">
                                <option value="source-over" ${layer.blend === 'source-over' ? 'selected' : ''}>Обычный</option>
                                <option value="multiply" ${layer.blend === 'multiply' ? 'selected' : ''}>Умножение</option>
                                <option value="overlay" ${layer.blend === 'overlay' ? 'selected' : ''}>Перекрытие</option>
                                <option value="screen" ${layer.blend === 'screen' ? 'selected' : ''}>Экран</option>
                                <option value="soft-light" ${layer.blend === 'soft-light' ? 'selected' : ''}>Мягкий свет</option>
                                <option value="darken" ${layer.blend === 'darken' ? 'selected' : ''}>Замена темным</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label>Прозрачность: ${Math.round(layer.opacity * 100)}%</label>
                            <input type="range" min="0" max="100" value="${layer.opacity * 100}" oninput="updateLayer(${layer.id}, 'opacity', parseInt(this.value) / 100, this)">
                        </div>
                    </div>
                `;
                layersContainer.appendChild(el);
            });
        }

        window.setActiveLayer = function(id) { activeLayerId = id; renderLayersUI(); }

        window.updateLayer = function(id, key, value, inputEl) {
            const layer = state.layers.find(l => l.id === id);
            if (layer) {
                layer[key] = value;
                
                // Если сменили тип на custom - перерисовываем UI
                if (key === 'type') {
                    renderLayersUI();
                }

                if (inputEl && inputEl.type === 'range') {
                    const label = inputEl.previousElementSibling;
                    if (key === 'noise') label.innerHTML = `Шум границ (Эрозия): ${value}%`;
                    if (key === 'colorNoise') label.innerHTML = `Шум пигмента (Цвет): ±${value}%`;
                    if (key === 'opacity') label.innerHTML = `Прозрачность: ${Math.round(value * 100)}%`;
                    if (key === 'scale') label.innerHTML = `Масштаб: ${value.toFixed(1)}x`;
                    if (key === 'scaleX') label.innerHTML = `Сжатие X: ${value.toFixed(1)}x`;
                    if (key === 'scaleY') label.innerHTML = `Сжатие Y: ${value.toFixed(1)}x`;
                    if (key === 'rotation') label.innerHTML = `Поворот: ${value}°`;
                }
                clearTimeout(window.genTimeout);
                window.genTimeout = setTimeout(() => updatePreview(), 30);
            }
        }

        // --- ОБРАБОТКА ЗАГРУЗКИ PNG ---
        window.uploadPattern = function(id, input) {
            if (!input.files || !input.files[0]) return;
            
            const layer = state.layers.find(l => l.id === id);
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Оптимизация памяти: если картинка большая, уменьшаем её до 256px по большей стороне
                    const maxDim = 256;
                    let scale = 1;
                    if (img.width > maxDim || img.height > maxDim) {
                        scale = Math.min(maxDim / img.width, maxDim / img.height);
                    }
                    
                    const c = document.createElement('canvas');
                    c.width = Math.round(img.width * scale);
                    c.height = Math.round(img.height * scale);
                    const ctx = c.getContext('2d');
                    ctx.drawImage(img, 0, 0, c.width, c.height);
                    
                    // Сохраняем как base64 строку для пресетов
                    layer.imageSrc = c.toDataURL('image/png');
                    
                    // Создаем финальный объект Image для отрисовки
                    const finalImg = new Image();
                    finalImg.onload = () => {
                        layer.image = finalImg;
                        updatePreview();
                    };
                    finalImg.src = layer.imageSrc;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        };

        window.addLayer = function() {
            const newId = Date.now();
            state.layers.push({
                id: newId, color: '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0'),
                type: 'smooth', noise: 10, colorNoise: 10, blend: 'multiply', opacity: 0.9,
                seed: Math.random() * 1000, scale: 1, scaleX: 1, scaleY: 1, rotation: 0, image: null, imageSrc: null
            });
            activeLayerId = newId;
            renderLayersUI();
            updatePreview();
        }

        window.removeLayer = function(id) {
            state.layers = state.layers.filter(l => l.id !== id);
            if (activeLayerId === id && state.layers.length > 0) activeLayerId = state.layers[state.layers.length - 1].id;
            renderLayersUI();
            updatePreview();
        }

        window.moveLayer = function(index, direction) {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < state.layers.length) {
                const temp = state.layers[index];
                state.layers[index] = state.layers[newIndex];
                state.layers[newIndex] = temp;
                renderLayersUI();
                updatePreview();
            }
        }

        // --- RANDOMIZER ---
        function generateRandomCamo() {
            const palettes = [
                ['#2b3b26', '#4a5e3a', '#1a2415', '#5e6e47', '#2e3b22'], // Forest
                ['#b59e74', '#8c7a54', '#d9c7a7', '#5a4d36', '#6d5f45'], // Desert
                ['#2f2f2f', '#474747', '#121212', '#636363', '#1f1f1f'], // Urban
                ['#e0e0e0', '#a0a0a0', '#ffffff', '#555555', '#7a7a7a'], // Winter
                ['#6b1d1d', '#9c3030', '#3d0a0a', '#c94a4a', '#822020']  // Red
            ];

            const types = ['brush', 'smooth', 'circles', 'wavy', 'cellular', 'splatter', 'digital'];
            const blends = ['source-over', 'multiply', 'overlay', 'screen', 'soft-light', 'darken'];

            const palette = palettes[Math.floor(Math.random() * palettes.length)];
            state.bgColor = palette[Math.floor(Math.random() * palette.length)];
            globalBgInput.value = state.bgColor;

            const numLayers = Math.floor(Math.random() * 4) + 2; 
            state.layers = [];
            
            for (let i = 0; i < numLayers; i++) {
                state.layers.push({
                    id: Date.now() + i,
                    color: palette[Math.floor(Math.random() * palette.length)],
                    type: types[Math.floor(Math.random() * types.length)],
                    noise: Math.floor(Math.random() * 25) + 5,
                    colorNoise: Math.floor(Math.random() * 15),
                    blend: i === 0 ? 'source-over' : blends[Math.floor(Math.random() * (blends.length - 1)) + 1],
                    opacity: Math.random() * 0.4 + 0.6, 
                    seed: Math.random() * 1000,
                    scale: Math.random() * 1.5 + 0.5, 
                    scaleX: Math.random() * 0.6 + 0.7, 
                    scaleY: Math.random() * 0.6 + 0.7,
                    rotation: Math.floor(Math.random() * 360),
                    image: null, imageSrc: null
                });
            }
            
            activeLayerId = state.layers[0].id;
            renderLayersUI();
            updatePreview();
        }

        // --- PRESET LOGIC ---
        function loadPresets() {
            let stored = localStorage.getItem(STORAGE_KEY);
            // Миграция со старых версий
            if (!stored) {
                const oldKeys = ['camo_presets_universal', 'camo_presets_v6', 'camo_presets_v5', 'camo_presets_v4', 'camo_presets_v3', 'camo_presets_v2'];
                for (let key of oldKeys) {
                    stored = localStorage.getItem(key);
                    if (stored) break;
                }
            }

            if (stored) {
                try {
                    let parsed = JSON.parse(stored);
                    presets = parsed.map(p => {
                        let fixedData = p.data;
                        if (!fixedData.bgColor) fixedData.bgColor = '#121816';
                        if (!fixedData.width) fixedData.width = 1024;
                        if (!fixedData.height) fixedData.height = 1024;
                        
                        if (fixedData.layers) {
                            fixedData.layers.forEach(layer => {
                                if (layer.colorNoise === undefined) layer.colorNoise = 10;
                                if (layer.scale === undefined) layer.scale = 1;
                                if (layer.scaleX === undefined) layer.scaleX = 1;
                                if (layer.scaleY === undefined) layer.scaleY = 1;
                                if (layer.rotation === undefined) layer.rotation = 0;
                                if (layer.seed === undefined) layer.seed = Math.random() * 1000;
                                if (layer.id === undefined) layer.id = Date.now() + Math.random();
                                if (layer.image === undefined) layer.image = null;
                                if (layer.imageSrc === undefined) layer.imageSrc = null;
                            });
                        }
                        return { name: p.name, data: fixedData };
                    });
                } catch (e) {
                    console.error("Ошибка загрузки пресетов", e);
                    presets = [];
                }
            }
            savePresets(); 
            renderPresetsUI();
        }

        function savePresets() { 
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(presets)); 
            } catch (e) {
                alert("Ошибка сохранения: Хранилище браузера переполнено. Удалите старые пресеты с PNG-файлами.");
            }
        }
        
        function renderPresetsUI() {
            presetCount.textContent = presets.length;
            presetList.innerHTML = '';
            presets.forEach((p, index) => {
                const el = document.createElement('div');
                el.className = 'preset-item';
                el.innerHTML = `
                    <span class="preset-name" title="${p.name}">${p.name}</span>
                    <div class="preset-actions">
                        <button class="small" onclick="loadPreset(${index})">Загр.</button>
                        <button class="danger small" onclick="deletePreset(${index})">X</button>
                    </div>
                `;
                presetList.appendChild(el);
            });
        }

        window.loadPreset = function(index) {
            state = JSON.parse(JSON.stringify(presets[index].data));
            rehydrateImages(); // Восстанавливаем картинки из base64
            if (state.layers.length > 0) activeLayerId = state.layers[0].id;
            document.getElementById('global-size').value = state.width;
            globalBgInput.value = state.bgColor;
            renderLayersUI();
            updatePreview();
        }

        window.deletePreset = function(index) { 
            presets.splice(index, 1); 
            savePresets(); 
            renderPresetsUI(); 
        }

        document.getElementById('btn-save-preset').addEventListener('click', () => {
            if (presets.length >= 30) { alert('Лимит пресетов (30) достигнут.'); return; }
            const nameInput = document.getElementById('preset-name');
            const name = nameInput.value.trim() || `Пресет ${presets.length + 1}`;
            presets.push({ name: name, data: JSON.parse(JSON.stringify(state)) });
            savePresets(); renderPresetsUI(); nameInput.value = '';
        });

        // --- CORE ENGINE ---
        function renderToCanvas(targetCtx, targetWidth, targetHeight) {
            targetCtx.fillStyle = state.bgColor;
            targetCtx.fillRect(0, 0, targetWidth, targetHeight);
            
            state.layers.forEach((layer) => {
                const layerCanvas = document.createElement('canvas');
                layerCanvas.width = targetWidth;
                layerCanvas.height = targetHeight;
                const lCtx = layerCanvas.getContext('2d', { willReadFrequently: true });

                drawBlobs(lCtx, layer, targetWidth, targetHeight);
                applyNoiseAndPigment(lCtx, layer, targetWidth, targetHeight);

                targetCtx.globalAlpha = layer.opacity;
                targetCtx.globalCompositeOperation = layer.blend;
                targetCtx.drawImage(layerCanvas, 0, 0);
            });

            targetCtx.globalAlpha = 1.0;
            targetCtx.globalCompositeOperation = 'source-over';
        }

        function drawBlobs(ctx, layer, w, h) {
            const numBlobs = 25; 
            const baseRadius = Math.min(w, h) * 0.15; 

            let seed = layer.seed;
            ctx.fillStyle = layer.color;
            ctx.strokeStyle = layer.color;

            for (let i = 0; i < numBlobs; i++) {
                const nx = seededRandom(seed++);
                const ny = seededRandom(seed++);
                const nRadius = (seededRandom(seed++) * 0.6 + 0.4); 
                
                const radius = nRadius * baseRadius;
                const blobSeed = seededRandom(seed++) * 100;

                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        ctx.save();
                        const x = (nx + dx) * w;
                        const y = (ny + dy) * h;
                        
                        ctx.translate(x, y);
                        ctx.rotate(layer.rotation * Math.PI / 180);
                        ctx.scale(layer.scale * layer.scaleX, layer.scale * layer.scaleY);
                        
                        // Если выбран кастомный PNG и он загружен
                        if (layer.type === 'custom' && layer.image) {
                            // Масштабируем размер штампа относительно базового разрешения
                            // Чтобы при экспорте 2048x2048 картинка была больше
                            const imgScale = w / BASE_RES; 
                            const dw = layer.image.width * imgScale;
                            const dh = layer.image.height * imgScale;
                            
                            // Рисуем картинку центрированно
                            ctx.drawImage(layer.image, -dw / 2, -dh / 2, dw, dh);
                        } else {
                            drawSingleBlob(ctx, radius, blobSeed, layer.type, w);
                        }
                        
                        ctx.restore();
                    }
                }
            }
        }

        function drawSingleBlob(ctx, radius, seed, type, canvasWidth) {
            // Если тип custom, но картинка не загружена, рисуем заглушку (квадрат)
            if (type === 'custom') {
                ctx.fillRect(-radius/2, -radius/2, radius, radius);
                return;
            }

            const resScale = canvasWidth / BASE_RES;

            ctx.beginPath();
            
            if (type === 'circles') {
                ctx.arc(0, 0, radius, 0, Math.PI * 2);
                ctx.fill();
            } 
            else if (type === 'wavy') {
                ctx.lineWidth = radius * 0.4;
                ctx.lineCap = 'round';
                const length = radius * 4;
                const steps = 20;
                for (let i = 0; i <= steps; i++) {
                    const px = (i / steps - 0.5) * length;
                    const py = (fastNoise(i * 0.2, seed, 0) - 0.5) * 2 * radius * 0.8;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
            else if (type === 'cellular') {
                ctx.lineWidth = radius * 0.15;
                ctx.lineJoin = 'round';
                const points = 6;
                for (let i = 0; i <= points; i++) {
                    const angle = (i / points) * Math.PI * 2;
                    const r = radius * (0.8 + fastNoise(Math.cos(angle), Math.sin(angle), seed) * 0.4);
                    const px = Math.cos(angle) * r;
                    const py = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
            }
            else if (type === 'splatter') {
                ctx.arc(0, 0, radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
                for (let i = 0; i < 15; i++) {
                    const angle = seededRandom(seed + i) * Math.PI * 2;
                    const dist = seededRandom(seed + i + 10) * radius * 1.2;
                    const r = seededRandom(seed + i + 20) * radius * 0.15;
                    ctx.beginPath();
                    ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            else if (type === 'digital') {
                const gridSize = Math.max(2, 8 * resScale); 
                const blocks = 10;
                for (let i = 0; i < blocks; i++) {
                    const bx = Math.floor((seededRandom(seed + i) - 0.5) * radius / gridSize) * gridSize;
                    const by = Math.floor((seededRandom(seed + i + 10) - 0.5) * radius / gridSize) * gridSize;
                    const bw = Math.floor(seededRandom(seed + i + 20) * 3 + 1) * gridSize;
                    const bh = Math.floor(seededRandom(seed + i + 30) * 3 + 1) * gridSize;
                    ctx.fillRect(bx, by, bw, bh);
                }
            }
            else {
                const points = type === 'brush' ? 64 : 32; 
                const roughness = type === 'brush' ? 1.2 : 0.35; 
                for (let i = 0; i <= points; i++) {
                    const angle = (i / points) * Math.PI * 2;
                    let noiseVal = fastNoise(Math.cos(angle) * 2, Math.sin(angle) * 2, seed);
                    if (type === 'brush') {
                        noiseVal = noiseVal * 0.6 + fastNoise(Math.cos(angle)*8, Math.sin(angle)*8, seed) * 0.4;
                    }
                    const r = radius * (1 + (noiseVal - 0.5) * roughness);
                    const px = Math.cos(angle) * r;
                    const py = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.filter = type === 'smooth' ? `blur(${3 * resScale}px)` : 'none'; 
                ctx.fill();
                ctx.filter = 'none'; 
            }
        }

        function applyNoiseAndPigment(ctx, layer, w, h) {
            if (layer.noise === 0 && layer.colorNoise === 0) return;

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const erosionVal = layer.noise / 100;
            const pigmentVal = layer.colorNoise / 100;
            let seed = layer.seed + 999;
            const freqScale = w / BASE_RES;

            for (let i = 0; i < data.length; i += 4) {
                if (data[i + 3] === 0) continue; 

                const x = (i / 4) % w;
                const y = Math.floor((i / 4) / w);

                if (pigmentVal > 0) {
                    let cNoise = (fastNoise(x * 0.02 * freqScale, y * 0.02 * freqScale, seed + 55) - 0.5) * 2;
                    let shift = cNoise * pigmentVal * 80;
                    data[i]     = Math.min(255, Math.max(0, data[i] + shift));
                    data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + shift));
                    data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + shift));
                }

                if (erosionVal > 0) {
                    let n1 = fastNoise(x * 0.05 * freqScale, y * 0.05 * freqScale, seed);
                    let n2 = fastNoise(x * 0.2 * freqScale, y * 0.2 * freqScale, seed + 1);
                    let n3 = fastNoise(x * 0.8 * freqScale, y * 0.8 * freqScale, seed + 2);
                    let finalNoise = (n1 * 0.2) + (n2 * 0.3) + (n3 * 0.5);

                    if (finalNoise < erosionVal) {
                        data[i + 3] = 0; 
                    } else if (finalNoise < erosionVal + 0.1) {
                        data[i + 3] = data[i + 3] * 0.5;
                    }
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // --- PREVIEW & EXPORT ---
        function updatePreview() {
            renderToCanvas(pCtx, PREVIEW_SIZE, PREVIEW_SIZE);
        }

        btnDownload.addEventListener('click', () => {
            const originalText = btnDownload.innerText;
            btnDownload.innerText = 'Генерация...';
            btnDownload.disabled = true;

            setTimeout(() => {
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = state.width;
                exportCanvas.height = state.height;
                const eCtx = exportCanvas.getContext('2d', { willReadFrequently: true });

                renderToCanvas(eCtx, state.width, state.height);

                exportCanvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = `camo_${state.width}x${state.height}.png`;
                    link.href = url;
                    link.click();
                    
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    
                    btnDownload.innerText = originalText;
                    btnDownload.disabled = false;
                }, 'image/png');
            }, 50); 
        });

        // --- INIT ---
        document.getElementById('btn-generate').addEventListener('click', updatePreview);
        document.getElementById('btn-random').addEventListener('click', generateRandomCamo);
        document.getElementById('btn-add-layer').addEventListener('click', addLayer);

        document.getElementById('global-size').addEventListener('change', (e) => {
            state.width = parseInt(e.target.value);
            state.height = parseInt(e.target.value);
        });

        globalBgInput.addEventListener('input', (e) => {
            state.bgColor = e.target.value;
            updatePreview();
        });

        function init() {
            loadPresets();
            renderLayersUI();
            globalBgInput.value = state.bgColor;
            updatePreview();
        }

        init();
    </script>
</body>
