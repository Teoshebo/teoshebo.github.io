<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RW Map Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <div id="topbar">
    <span class="logo">RW EDITOR</span>
    <input type="file" id="fileInput" accept=".tmx,application/xml,text/xml" hidden>
    <input type="file" id="tilesetInput" accept="image/png,image/*" hidden>
    <button id="btnOpen" class="primary">📂 Открыть</button>
    <button id="btnSave" class="save">💾 Сохранить</button>
    <button id="btnAddTileset" title="Добавить tileset из PNG">＋ Tileset</button>
    <button id="btnResize" title="Изменить размер карты">⤢ Размер</button>
    <button id="btnMerge" title="Склеить несколько карт">⌘ Merge</button>
    <button id="btnExportMap" title="Сохранить карту как PNG 500×500">📷 _map</button>
    <input type="text" id="mapName" placeholder="имя файла" title="Имя файла при сохранении">
    <div class="sep"></div>
    <button id="btnFit">Fit</button>
    <button id="btnReset">1:1</button>
    <div class="zoom-box">Zoom <b id="zoomVal">1.00</b></div>
    <div class="sep"></div>
    <label class="topbar-check">
      <input type="checkbox" id="showMarkers">
      MARKERS
    </label>
    <div class="sep"></div>
    <button id="btnSettings">⚙</button>
    <button id="btnHelp">?</button>
    <span id="status">Загрузи .tmx файл</span>
  </div>

  <div id="main">
    <div id="tools"></div>
    <div id="wrap">
      <canvas id="cv"></canvas>
      <div id="fps">—</div>
      <div id="info">—</div>
      <div id="pickBanner" class="hidden">
        <span id="pickBannerText">—</span>
        <button id="btnPickCancel">Отмена</button>
      </div>
      <div id="rightPanel">
        <div id="layers"><h3>LAYERS <span id="activeLayerLabel">—</span></h3></div>
        <div id="brushPanel">
          <h3>BRUSH
            <button id="btnAddEmpty" title="Добавить пустоту в кисть">+EMPTY</button>
            <button id="btnFlood" title="Залить доминирующим типом (≥3 соседа)">FLOOD</button>
            <button id="btnClearBrush">CLEAR</button>
          </h3>
          <div id="brushSettings" class="brush-settings"></div>
          <div id="brushList"></div>
          <div id="brushTotal">Σ 0</div>
          <div id="classicPanel" class="classic-panel">
            <div class="classic-title">CLASSIC TERRAIN</div>
            <select id="classicSelect"></select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div id="bottomGrabber" title="Потяни, чтобы изменить высоту"></div>
    <div id="tsTabs">
      <button id="btnAtlasesTab" class="section-tab active">ATLASES</button>
      <button id="btnTypesTab" class="section-tab types-tab active">TYPES</button>
      <button id="btnGenTab" class="section-tab gen-tab">GENERATOR</button>
      <button id="btnV3Tab" class="section-tab v3-tab">3D</button>
      <div id="tsTabsList"></div>
      <div class="right">
        <button id="btnToggleBottom" class="toggle">▼</button>
      </div>
    </div>
    <div id="bottomBody">
      <div id="tsBody"><div class="empty-msg">Загрузи карту, чтобы увидеть атласы</div></div>
      <div id="typesBody"></div>
      <div id="hmGenBody" class="hidden"></div>
      <div id="hmV3Body" class="hidden"></div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════ -->
<!-- MERGE MODAL -->
<!-- ═══════════════════════════════════════════════ -->
<div id="mergeModal" class="hidden">
  <div class="merge-dialog">
    <div class="merge-header">
      <span>MERGE MAPS</span>
      <button id="mergeClose" title="Закрыть">×</button>
    </div>
    <div class="merge-main">
      <div id="mergeStage"></div>
      <div class="merge-side">
        <div class="merge-side-title">PRIORITY · top wins overlap</div>
        <div id="mergeList"></div>
        <div class="merge-side-actions">
          <button id="mergeAdd">+ ADD MAP</button>
        </div>
      </div>
    </div>
    <div class="merge-footer">
      <span id="mergeInfo">Пусто</span>
      <label class="merge-snap-label">
        <input type="checkbox" id="mergeSnap" checked>
        SNAP
      </label>
      <button id="mergeFit">FIT</button>
      <button id="mergeClear" class="danger">CLEAR</button>
      <button id="mergeCancel">CANCEL</button>
      <button id="mergeRun" class="primary">MERGE</button>
    </div>
  </div>
</div>
<input type="file" id="mergeFileInput" accept=".tmx" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/tmx.js"></script>
<script src="js/map.js"></script>
<script src="js/types.js"></script>
<script src="js/storage.js"></script>
<script src="js/generator.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/hm_core.js"></script>
<script src="js/hm_png.js"></script>
<script src="js/hm_apply.js"></script>
<script src="js/view3d.js"></script>
<script src="js/hm_panel.js"></script>
<script src="js/hm_app.js"></script>
<script src="js/merge.js"></script>
<script src="js/merge_ui.js"></script>
<script src="js/minitns_lib.js"></script>
<script src="js/app.js"></script>
</body>
</html>
