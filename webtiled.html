<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebTiled</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <div id="topbar">
    <span class="logo">WebTiled</span>
    <input type="file" id="fileInput" accept=".tmx,application/xml,text/xml" hidden>
    <input type="file" id="tilesetInput" accept="image/png,image/*" hidden>

    <button id="btnOpen" class="primary">
      <img class="btn-ic" src="asset/icon/open.png" data-emoji="📂" alt="">
      <span data-i18n="btn.open">Open</span>
    </button>
    <button id="btnSave" class="save">
      <img class="btn-ic" src="asset/icon/save.png" data-emoji="💾" alt="">
      <span data-i18n="btn.save">Save</span>
    </button>

    <div class="sep"></div>

    <button id="btnUndo" title="Undo (Ctrl+Z)">
      <img class="btn-ic" src="asset/icon/undo.png" data-emoji="↶" alt="">
      <span>Undo</span>
    </button>
    <button id="btnRedo" title="Redo (Ctrl+Y)">
      <img class="btn-ic" src="asset/icon/redo.png" data-emoji="↷" alt="">
      <span>Redo</span>
    </button>

    <div class="sep"></div>

    <button id="btnResize" title="Change map size">
      <img class="btn-ic" src="asset/icon/resize.png" data-emoji="⤢" alt="">
      <span data-i18n="btn.resize">Size</span>
    </button>
    <button id="btnMerge" title="Merge multiple maps">
      <img class="btn-ic" src="asset/icon/merge.png" data-emoji="⌘" alt="">
      <span data-i18n="btn.merge">Merge</span>
    </button>
    <button id="btnExportMap" title="Save map as PNG 500×500">
      <img class="btn-ic" src="asset/icon/export.png" data-emoji="📷" alt="">
      <span data-i18n="btn.exportMap">_map</span>
    </button>


    <input type="text" id="mapName" placeholder="filename" title="Filename for saving">

    <div class="sep"></div>

    <button id="btnFit" data-i18n="btn.fit">Fit</button>
    <button id="btnReset" data-i18n="btn.reset">1:1</button>
    <div class="zoom-box">Zoom <b id="zoomVal">1.00</b></div>

    <div class="sep"></div>

    <button id="btnSettings" title="Settings">
      <img class="btn-ic" src="asset/icon/settings.png" data-emoji="⚙" alt="">
    </button>
    <button id="btnDocs" title="Documentation">
      <img class="btn-ic" src="asset/icon/docs.png" data-emoji="📖" alt="">
    </button>


    <span id="status" data-i18n="status.idle">Load .tmx file</span>
  </div>

  <div id="main">
    <div id="tools"></div>
    <div id="wrap">
      <canvas id="cv"></canvas>
      <div id="fps">—</div>
      <div id="info">—</div>
      <div id="pickBanner" class="hidden">
        <span id="pickBannerText">—</span>
        <button id="btnPickCancel">Cancel</button>
      </div>
      <div id="rightPanel">
        <div id="layers"><h3>LAYERS <span id="activeLayerLabel">—</span></h3></div>
        <div id="brushPanel">
          <h3>BRUSH
            <button id="btnAddEmpty" title="Add EMPTY to brush">+EMPTY</button>
            <button id="btnFlood" title="Flood dominant type (≥3 neighbors)">FLOOD</button>
            <button id="btnClearBrush">CLEAR</button>
          </h3>
          <div id="brushSettings" class="brush-settings"></div>
          <div id="brushList"></div>
          <div id="brushTotal">Σ 0</div>
          <div id="classicPanel" class="classic-panel">
            <div class="classic-title">CLASSIC TERRAIN</div>
            <select id="classicSelect"></select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div id="bottomGrabber" title="Drag to resize"></div>
    <div id="tsTabs">
      <button id="btnAtlasesTab" class="section-tab active" data-i18n="tab.atlases">ATLASES</button>
      <button id="btnTypesTab" class="section-tab types-tab active" data-i18n="tab.types">TYPES</button>
      <button id="btnGenTab" class="section-tab gen-tab" data-i18n="tab.gen">GENERATOR</button>
      <button id="btnV3Tab" class="section-tab v3-tab" data-i18n="tab.v3">3D</button>
      <div id="tsTabsList"></div>
      <div class="right">
        <button id="btnToggleBottom" class="toggle">▼</button>
      </div>
    </div>
    <div id="bottomBody">
      <div id="tsBody"><div class="empty-msg">Load a map to see atlases</div></div>
      <div id="typesBody"></div>
      <div id="hmGenBody" class="hidden"></div>
      <div id="hmV3Body" class="hidden"></div>
    </div>
  </div>
</div>

<!-- MERGE MODAL -->
<div id="mergeModal" class="hidden">
  <div class="merge-dialog">
    <div class="merge-header">
      <span>MERGE MAPS</span>
      <button id="mergeClose" title="Close">×</button>
    </div>
    <div class="merge-main">
      <div id="mergeStage"></div>
      <div class="merge-side">
        <div class="merge-side-title">PRIORITY · top wins overlap</div>
        <div id="mergeList"></div>
        <div class="merge-side-actions">
          <button id="mergeAdd">+ ADD MAP</button>
        </div>
      </div>
    </div>
    <div class="merge-footer">
      <span id="mergeInfo">Empty</span>
      <label class="merge-snap-label">
        <input type="checkbox" id="mergeSnap" checked>
        SNAP
      </label>
      <button id="mergeFit">FIT</button>
      <button id="mergeClear" class="danger">CLEAR</button>
      <button id="mergeCancel">CANCEL</button>
      <button id="mergeRun" class="primary">MERGE</button>
    </div>
  </div>
</div>
<input type="file" id="mergeFileInput" accept=".tmx" multiple hidden>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="hidden">
  <div class="settings-dialog">
    <div class="settings-header">
      <span data-i18n="settings.title">SETTINGS</span>
      <button id="settingsClose" title="Close">×</button>
    </div>
    <div class="settings-body">

      <div class="settings-section">
        <div class="settings-section-title" data-i18n="settings.language">LANGUAGE</div>
        <div class="settings-lang-row">
          <button id="settingsLangEn" class="settings-lang-btn">English</button>
          <button id="settingsLangRu" class="settings-lang-btn">Русский</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-title" data-i18n="settings.appearance">APPEARANCE</div>
        <label class="settings-field">
          <span data-i18n="settings.canvasBg">Editor background</span>
          <input type="color" id="settingsCanvasBg" value="#0a0a0a">
        </label>
        <label class="settings-field">
          <span data-i18n="settings.atlasBg">Atlas / tiles background</span>
          <input type="color" id="settingsAtlasBg" value="#0a0a0a">
        </label>
      </div>

      <div class="settings-section">
        <div class="settings-section-title" data-i18n="settings.markers">MARKERS</div>
        <label class="settings-field settings-field-check">
          <input type="checkbox" id="settingsShowMarkers">
          <span data-i18n="settings.showMarkers">Show markers</span>
        </label>
        <label class="settings-field">
          <span data-i18n="settings.markerSize">Marker size</span>
          <input type="range" id="settingsMarkerScale" min="0.3" max="3" step="0.05" value="1">
          <b id="settingsMarkerScaleVal" class="settings-slider-val">1.00×</b>
        </label>
      </div>

    </div>
    <div class="settings-footer">
      <button id="settingsCancel" data-i18n="settings.cancel">CANCEL</button>
      <button id="settingsApply" class="primary" data-i18n="settings.apply">APPLY</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/tmx.js"></script>
<script src="js/map.js"></script>
<script src="js/types.js"></script>
<script src="js/storage.js"></script>
<script src="js/generator.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/hm_core.js"></script>
<script src="js/hm_png.js"></script>
<script src="js/hm_apply.js"></script>
<script src="js/view3d.js"></script>
<script src="js/hm_panel.js"></script>
<script src="js/hm_app.js"></script>
<script src="js/merge.js"></script>
<script src="js/merge_ui.js"></script>
<script src="js/minitns_lib.js"></script>
<script src="js/app.js"></script>
</body>
</html>
