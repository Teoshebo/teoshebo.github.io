<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Редактор дерева технологий</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;color:#e2e8f0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

  /* ---------- Холст ---------- */
  #canvas{position:fixed;inset:0;overflow:hidden;touch-action:none;
    background:radial-gradient(circle at 1px 1px,#1e293b 1px,transparent 0) 0 0/24px 24px}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}

  #edges{position:absolute;left:-20000px;top:-20000px;width:40000px;height:40000px;
    pointer-events:none;overflow:visible}
  #edges path.edge{fill:none;stroke:#64748b;stroke-width:4;pointer-events:none;
    stroke-linejoin:round;stroke-linecap:round;transition:stroke .12s}
  #edges path.edge-hit{fill:none;stroke:transparent;stroke-width:20;pointer-events:stroke;cursor:pointer}
  #edges path.edge-hit:hover + path.edge{stroke:#ef4444}
  #edges path.edge-hit:active + path.edge{stroke:#ef4444}

  /* ---------- Узлы ---------- */
  .node{position:absolute;width:170px;background:#1e293b;border:2px solid #3b82f6;
    border-radius:12px;padding:8px 10px;box-shadow:0 2px 10px rgba(0,0,0,.45);
    user-select:none;-webkit-user-select:none;cursor:grab}
  .node.selected{border-color:#60a5fa;
    box-shadow:0 0 0 3px rgba(96,165,250,.30),0 2px 12px rgba(0,0,0,.5)}
  .node.connecting{border-color:#22c55e;
    box-shadow:0 0 0 3px rgba(34,197,94,.35)}
  .node-title{font-weight:700;font-size:14px;line-height:1.25;
    margin-bottom:4px;word-break:break-word;color:#f1f5f9}
  .node-text{font-size:12px;line-height:1.35;
    white-space:pre-wrap;word-break:break-word;color:#e2e8f0;opacity:.72}

  /* ---------- Панель инструментов ---------- */
  #toolbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:6px;
    padding:8px;padding-top:calc(8px + env(safe-area-inset-top));
    background:rgba(15,23,42,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid #1e293b;overflow-x:auto;scrollbar-width:none}
  #toolbar::-webkit-scrollbar{display:none}
  #toolbar button{flex:0 0 auto;border:1px solid #334155;background:#1e293b;color:#e2e8f0;
    padding:9px 13px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
    white-space:nowrap;font-family:inherit;transition:background .12s}
  #toolbar button:active{background:#334155}
  #toolbar button.active{background:#2563eb;border-color:#2563eb;color:#fff}

  /* ---------- Редактор узла ---------- */
  #editor{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));
    z-index:10;max-width:440px;margin:0 auto;background:#1e293b;border:1px solid #334155;
    border-radius:14px;box-shadow:0 -4px 24px rgba(0,0,0,.55);
    padding:10px;display:flex;flex-direction:column;gap:8px}
  #editor.hidden{display:none}
  #editor input[type=text],#editor textarea{width:100%;border:1px solid #334155;border-radius:9px;
    padding:8px 9px;font:inherit;font-size:14px;resize:none;outline:none;background:#0f172a;color:#e2e8f0}
  #editor input[type=text]:focus,#editor textarea:focus{border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.25)}
  #editor .colors{display:flex;gap:8px}
  #editor .colors label{flex:1;display:flex;align-items:center;gap:7px;font-size:13px;
    color:#94a3b8;background:#0f172a;border:1px solid #334155;border-radius:9px;padding:5px 8px}
  #editor .colors input[type=color]{width:34px;height:26px;padding:0;border:1px solid #334155;
    border-radius:6px;background:#0f172a;cursor:pointer}
  #editor .row{display:flex;gap:8px}
  #editor .row button{flex:1;padding:11px;border-radius:10px;border:1px solid #334155;
    background:#0f172a;color:#e2e8f0;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
  #editor .row button.danger{background:#7f1d1d;border-color:#991b1b;color:#fecaca}
  #editor .row button:active{filter:brightness(1.2)}

  /* ---------- Статус ---------- */
  #status{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);
    z-index:11;background:#2563eb;color:#fff;padding:7px 16px;border-radius:999px;
    font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
    box-shadow:0 4px 16px rgba(0,0,0,.4)}
  #status.show{opacity:1}
</style>
</head>
<body>

<div id="canvas">
  <div id="world">
    <svg id="edges" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
                markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse"
                orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
        </marker>
      </defs>
      <g id="edgesG" transform="translate(20000,20000)"></g>
    </svg>
  </div>
</div>

<div id="toolbar">
  <button id="btnAdd">＋ Узел</button>
  <button id="btnLink">🔗 Связь</button>
  <button id="btnFit">⤢ Центр</button>
  <button id="btnSave">💾 Сохранить</button>
  <button id="btnLoad">📂 Загрузить</button>
  <button id="btnNew">🆕 Новый</button>
</div>

<div id="editor" class="hidden">
  <input id="edTitle" type="text" placeholder="Название" autocomplete="off">
  <textarea id="edText" rows="2" placeholder="Описание"></textarea>
  <div class="colors">
    <label>Фон <input type="color" id="edBg"></label>
    <label>Обводка <input type="color" id="edBorder"></label>
  </div>
  <div class="row">
    <button id="edDelete" class="danger">Удалить</button>
    <button id="edClose">Готово</button>
  </div>
</div>

<div id="status"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const canvas  = document.getElementById('canvas');
const world   = document.getElementById('world');
const gEdges  = document.getElementById('edgesG');
const editor  = document.getElementById('editor');
const edTitle = document.getElementById('edTitle');
const edText  = document.getElementById('edText');
const edBg    = document.getElementById('edBg');
const edBorder= document.getElementById('edBorder');
const statusEl= document.getElementById('status');
const fileInput = document.getElementById('fileInput');

const SVGNS = 'http://www.w3.org/2000/svg';
const LS_KEY = 'tech-tree-editor-v1';
const DEF_BG = '#1e293b';
const DEF_BORDER = '#3b82f6';

let nodes = [];
let edges = [];
let els   = new Map();
let view  = { x: 20, y: 100, s: 1 };
let selectedId = null;
let linkMode = false;
let linkFrom = null;
let uid = 1;

const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const getNode = id => nodes.find(n => n.id === id);

/* ============================================================
   ВИД
   ============================================================ */
function applyView(){
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
}

function fitView(){
  if (!nodes.length){ view = {x:20,y:100,s:1}; applyView(); return; }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for (const n of nodes){
    minX=Math.min(minX,n.x); minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x+(n._w||170)); maxY=Math.max(maxY,n.y+(n._h||60));
  }
  const r = canvas.getBoundingClientRect();
  const pad = 30, topPad = 72;
  const w = Math.max(maxX-minX,1), h = Math.max(maxY-minY,1);
  const s = clamp(Math.min((r.width-pad*2)/w, (r.height-topPad-pad)/h), 0.25, 1.2);
  view.s = s;
  view.x = (r.width - w*s)/2 - minX*s;
  view.y = topPad + (r.height - topPad - h*s)/2 - minY*s;
  applyView();
}

/* ============================================================
   ЦВЕТА / КОНТРАСТ
   ============================================================ */
function contrastColor(hex){
  if (!hex || hex.length < 7) return '#e2e8f0';
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const lum = 0.299*r + 0.587*g + 0.114*b;
  return lum > 140 ? '#0f172a' : '#e2e8f0';
}

function applyNodeStyle(n){
  const el = els.get(n.id);
  if (!el) return;
  el.style.background = n.bgColor;
  el.style.borderColor = n.borderColor;
  const tc = contrastColor(n.bgColor);
  const t = el.querySelector('.node-title');
  const x = el.querySelector('.node-text');
  if (t) t.style.color = tc;
  if (x){ x.style.color = tc; x.style.opacity = '0.72'; }
}

/* ============================================================
   УЗЛЫ
   ============================================================ */
function newId(){
  let id;
  do { id = 'n' + (uid++); } while (nodes.some(n => n.id === id));
  return id;
}

function measure(n){
  const el = els.get(n.id);
  if (el){ n._w = el.offsetWidth; n._h = el.offsetHeight; }
}

function positionNode(n){
  const el = els.get(n.id);
  if (el) el.style.transform = `translate(${n.x}px,${n.y}px)`;
}

function addNode(data){
  const n = {
    id:    data.id || newId(),
    x:     typeof data.x === 'number' ? data.x : 0,
    y:     typeof data.y === 'number' ? data.y : 0,
    title: data.title != null ? String(data.title) : 'Новый узел',
    text:  data.text  != null ? String(data.text)  : '',
    bgColor:     data.bgColor     || DEF_BG,
    borderColor: data.borderColor || DEF_BORDER
  };
  nodes.push(n);

  const el = document.createElement('div');
  el.className = 'node';
  el.dataset.id = n.id;
  el.innerHTML = '<div class="node-title"></div><div class="node-text"></div>';
  el.querySelector('.node-title').textContent = n.title;
  el.querySelector('.node-text').textContent  = n.text;
  el.style.transform = `translate(${n.x}px,${n.y}px)`;
  world.appendChild(el);
  els.set(n.id, el);
  applyNodeStyle(n);
  measure(n);
  return n;
}

function deleteNode(id){
  const el = els.get(id);
  if (el) el.remove();
  els.delete(id);
  nodes = nodes.filter(n => n.id !== id);
  edges = edges.filter(e => e.from !== id && e.to !== id);
  if (selectedId === id) select(null);
  if (linkFrom === id) cancelLink();
  drawEdges();
  saveLocal();
}

/* ============================================================
   СВЯЗИ — ОРТОГОНАЛЬНЫЕ (только 90°)
   ============================================================ */
function getAnchor(n, other){
  const cx = n.x + n._w/2, cy = n.y + n._h/2;
  const ox = other.x + other._w/2, oy = other.y + other._h/2;
  const dx = ox - cx, dy = oy - cy;

  if (Math.abs(dx) >= Math.abs(dy)){
    return {
      x: dx >= 0 ? n.x + n._w : n.x,
      y: cy,
      side: dx >= 0 ? 'right' : 'left'
    };
  } else {
    return {
      x: cx,
      y: dy >= 0 ? n.y + n._h : n.y,
      side: dy >= 0 ? 'bottom' : 'top'
    };
  }
}

function orthoPath(points, radius){
  if (radius === undefined) radius = 10;
  if (points.length < 2) return '';
  let d = `M${points[0].x},${points[0].y}`;
  for (let i=1; i<points.length-1; i++){
    const prev = points[i-1], cur = points[i], next = points[i+1];
    const lenIn  = Math.hypot(cur.x-prev.x, cur.y-prev.y);
    const lenOut = Math.hypot(next.x-cur.x, next.y-cur.y);
    const r = Math.min(radius, lenIn/2, lenOut/2);
    if (r < 2){
      d += ` L${cur.x},${cur.y}`;
    } else {
      const inUx  = (cur.x-prev.x)/lenIn,  inUy  = (cur.y-prev.y)/lenIn;
      const outUx = (next.x-cur.x)/lenOut, outUy = (next.y-cur.y)/lenOut;
      const ax = cur.x - inUx*r,  ay = cur.y - inUy*r;
      const bx = cur.x + outUx*r, by = cur.y + outUy*r;
      d += ` L${ax},${ay} Q${cur.x},${cur.y} ${bx},${by}`;
    }
  }
  const last = points[points.length-1];
  d += ` L${last.x},${last.y}`;
  return d;
}

function buildEdgePath(a, b){
  // a = откуда, b = куда
  const pa = getAnchor(a, b);
  const pb = getAnchor(b, a);

  if ((pa.side==='left'||pa.side==='right') && (pb.side==='left'||pb.side==='right')){
    const midX = (pa.x + pb.x) / 2;
    return orthoPath([
      {x: pa.x, y: pa.y},
      {x: midX, y: pa.y},
      {x: midX, y: pb.y},
      {x: pb.x, y: pb.y}
    ]);
  }
  if ((pa.side==='top'||pa.side==='bottom') && (pb.side==='top'||pb.side==='bottom')){
    const midY = (pa.y + pb.y) / 2;
    return orthoPath([
      {x: pa.x, y: pa.y},
      {x: pa.x, y: midY},
      {x: pb.x, y: midY},
      {x: pb.x, y: pb.y}
    ]);
  }
  // смешанный вариант (на практике редко, но пусть будет)
  if (pa.side==='left' || pa.side==='right'){
    return orthoPath([
      {x: pa.x, y: pa.y},
      {x: pb.x, y: pa.y},
      {x: pb.x, y: pb.y}
    ]);
  }
  return orthoPath([
    {x: pa.x, y: pa.y},
    {x: pa.x, y: pb.y},
    {x: pb.x, y: pb.y}
  ]);
}

function drawEdges(){
  gEdges.innerHTML = '';
  for (const e of edges){
    const a = getNode(e.from), b = getNode(e.to);
    if (!a || !b || !a._w || !b._w) continue;

    const d = buildEdgePath(a, b);

    // невидимая «широкая» линия для удобного нажатия
    const hit = document.createElementNS(SVGNS, 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('class', 'edge-hit');
    hit.dataset.id = e.id;
    gEdges.appendChild(hit);

    // видимая линия со стрелкой
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'edge');
    path.setAttribute('marker-end', 'url(#arrow)');
    path.dataset.id = e.id;
    gEdges.appendChild(path);
  }
}

/* ============================================================
   ВЫДЕЛЕНИЕ / РЕДАКТОР
   ============================================================ */
function select(id){
  selectedId = id;
  document.querySelectorAll('.node.selected').forEach(el => el.classList.remove('selected'));
  if (id && els.has(id)){
    els.get(id).classList.add('selected');
    const n = getNode(id);
    edTitle.value  = n.title;
    edText.value   = n.text;
    edBg.value     = n.bgColor;
    edBorder.value = n.borderColor;
    editor.classList.remove('hidden');
  } else {
    editor.classList.add('hidden');
  }
}

edTitle.addEventListener('input', () => {
  const n = getNode(selectedId); if (!n) return;
  n.title = edTitle.value;
  els.get(n.id).querySelector('.node-title').textContent = n.title;
  measure(n); drawEdges(); saveLocal();
});

edText.addEventListener('input', () => {
  const n = getNode(selectedId); if (!n) return;
  n.text = edText.value;
  els.get(n.id).querySelector('.node-text').textContent = n.text;
  measure(n); drawEdges(); saveLocal();
});

edBg.addEventListener('input', () => {
  const n = getNode(selectedId); if (!n) return;
  n.bgColor = edBg.value;
  applyNodeStyle(n);
  saveLocal();
});

edBorder.addEventListener('input', () => {
  const n = getNode(selectedId); if (!n) return;
  n.borderColor = edBorder.value;
  applyNodeStyle(n);
  saveLocal();
});

document.getElementById('edDelete').onclick = () => {
  const n = getNode(selectedId);
  if (n && confirm('Удалить узел «' + n.title + '» и все его связи?')) deleteNode(n.id);
};
document.getElementById('edClose').onclick = () => select(null);

/* ============================================================
   РЕЖИМ СВЯЗИ
   ============================================================ */
function cancelLink(){
  if (linkFrom && els.has(linkFrom)) els.get(linkFrom).classList.remove('connecting');
  linkFrom = null;
}

function linkTap(n){
  if (!linkFrom){
    linkFrom = n.id;
    els.get(n.id).classList.add('connecting');
    showStatus('Коснитесь второго узла');
  } else if (linkFrom === n.id){
    cancelLink();
  } else {
    if (!edges.some(e => e.from === linkFrom && e.to === n.id)){
      edges.push({ id:'e' + (uid++), from: linkFrom, to: n.id });
    }
    cancelLink();
    drawEdges();
    saveLocal();
    showStatus('Связь создана');
  }
}

/* ============================================================
   ЖЕСТЫ
   ============================================================ */
const pointers = new Map();
let gesture = null;
let pinch = null;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if (pointers.size === 1){
    const nodeEl = e.target.closest ? e.target.closest('.node') : null;
    const node = nodeEl ? getNode(nodeEl.dataset.id) : null;
    let type;
    if (node) type = linkMode ? 'none' : 'node';
    else      type = 'canvas';

    gesture = {
      type, node,
      startX: e.clientX, startY: e.clientY,
      vx: view.x, vy: view.y,
      nx: node ? node.x : 0,
      ny: node ? node.y : 0,
      moved: false
    };

    if (node && !linkMode) select(node.id);
  } else if (pointers.size === 2){
    gesture = null;
    pinchStart();
  }
});

canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if (pointers.size >= 2){ updatePinch(); return; }

  const g = gesture;
  if (!g) return;

  const dx = e.clientX - g.startX;
  const dy = e.clientY - g.startY;
  if (!g.moved && Math.hypot(dx,dy) > 6) g.moved = true;

  if (g.type === 'node'){
    g.node.x = g.nx + dx / view.s;
    g.node.y = g.ny + dy / view.s;
    positionNode(g.node);
    drawEdges();
  } else if (g.type === 'canvas'){
    view.x = g.vx + dx;
    view.y = g.vy + dy;
    applyView();
  }
});

function endPointer(e){
  const g = gesture;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;

  if (pointers.size === 0 && g){
    gesture = null;
    if (!g.moved){
      handleTap(e.clientX, e.clientY);
    } else if (g.type === 'node' || g.type === 'canvas'){
      saveLocal();
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

function handleTap(x, y){
  const el = document.elementFromPoint(x, y);
  if (!el) return;

  const nodeEl = el.closest ? el.closest('.node') : null;
  if (nodeEl){
    const n = getNode(nodeEl.dataset.id);
    if (!n) return;
    if (linkMode){ linkTap(n); return; }
    select(n.id);
    return;
  }

  // клик по связи (невидимая «широкая» полоса)
  if (el.classList && el.classList.contains('edge-hit')){
    const id = el.dataset.id;
    if (linkMode){ cancelLink(); return; }
    if (confirm('Удалить эту связь?')){
      edges = edges.filter(e => e.id !== id);
      drawEdges(); saveLocal();
      showStatus('Связь удалена');
    }
    return;
  }

  if (linkMode){ cancelLink(); return; }
  select(null);
}

/* ---------- Зум двумя пальцами ---------- */
function pinchStart(){
  const p = [...pointers.values()];
  pinch = {
    dist: Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y) || 1,
    cx: (p[0].x+p[1].x)/2,
    cy: (p[0].y+p[1].y)/2,
    s: view.s, vx: view.x, vy: view.y
  };
}

function updatePinch(){
  if (!pinch) return;
  const p = [...pointers.values()];
  const d  = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y) || 1;
  const cx = (p[0].x+p[1].x)/2;
  const cy = (p[0].y+p[1].y)/2;

  const r = canvas.getBoundingClientRect();
  const wx = (pinch.cx - r.left - pinch.vx) / pinch.s;
  const wy = (pinch.cy - r.top  - pinch.vy) / pinch.s;

  const s = clamp(pinch.s * (d / pinch.dist), 0.2, 3);
  view.s = s;
  view.x = (cx - r.left) - wx * s;
  view.y = (cy - r.top)  - wy * s;
  applyView();
}

/* ---------- Зум колесом ---------- */
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const wx = (e.clientX - r.left - view.x) / view.s;
  const wy = (e.clientY - r.top  - view.y) / view.s;
  const s = clamp(view.s * (e.deltaY < 0 ? 1.12 : 1/1.12), 0.2, 3);
  view.s = s;
  view.x = (e.clientX - r.left) - wx * s;
  view.y = (e.clientY - r.top)  - wy * s;
  applyView();
}, { passive:false });

/* ---------- Двойной клик по фону — новый узел ---------- */
canvas.addEventListener('dblclick', e => {
  if (e.target.closest('.node')) return;
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left - view.x) / view.s - 85;
  const y = (e.clientY - r.top  - view.y) / view.s - 30;
  const n = addNode({ x, y, title:'Новый узел', text:'' });
  drawEdges(); saveLocal();
  select(n.id);
});

/* ============================================================
   КНОПКИ
   ============================================================ */
document.getElementById('btnAdd').onclick = () => {
  const r = canvas.getBoundingClientRect();
  const x = (r.width/2 - view.x)/view.s - 85 + (Math.random()*40-20);
  const y = (r.height/2 - view.y)/view.s - 30 + (Math.random()*40-20);
  const n = addNode({ x, y, title:'Новый узел', text:'' });
  drawEdges(); saveLocal();
  select(n.id);
  showStatus('Узел добавлен');
};

const btnLink = document.getElementById('btnLink');
btnLink.onclick = () => {
  linkMode = !linkMode;
  btnLink.classList.toggle('active', linkMode);
  cancelLink();
  showStatus(linkMode ? 'Режим связи включён' : 'Режим связи выключен');
};

document.getElementById('btnFit').onclick = () => { fitView(); showStatus('По центру'); };

document.getElementById('btnSave').onclick = () => {
  const blob = new Blob([serialize()], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tech-tree-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  showStatus('Файл сохранён');
};

document.getElementById('btnLoad').onclick = () => fileInput.click();

document.getElementById('btnNew').onclick = () => {
  if (!confirm('Очистить всё дерево? Несохранённые изменения будут потеряны.')) return;
  els.forEach(el => el.remove());
  els.clear();
  nodes = []; edges = [];
  gEdges.innerHTML = '';
  select(null);
  cancelLink();
  view = {x:20,y:100,s:1};
  applyView();
  saveLocal();
  showStatus('Новое дерево');
};

fileInput.onchange = () => {
  const f = fileInput.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      loadProject(JSON.parse(reader.result));
      saveLocal();
      showStatus('Проект загружен');
    } catch(err){
      alert('Не удалось прочитать файл:\n' + err.message);
    }
  };
  reader.readAsText(f);
  fileInput.value = '';
};

/* ============================================================
   JSON
   ============================================================ */
function serialize(){
  return JSON.stringify({
    version: 2,
    view: { x: Math.round(view.x), y: Math.round(view.y), s: +view.s.toFixed(3) },
    nodes: nodes.map(n => ({
      id: n.id,
      x: Math.round(n.x),
      y: Math.round(n.y),
      title: n.title,
      text: n.text,
      bgColor: n.bgColor,
      borderColor: n.borderColor
    })),
    edges: edges.map(e => ({ from: e.from, to: e.to }))
  }, null, 2);
}

function loadProject(data){
  els.forEach(el => el.remove());
  els.clear();
  gEdges.innerHTML = '';
  nodes = []; edges = [];
  select(null);
  cancelLink();
  uid = 1;

  (data.nodes || []).forEach(nd => {
    addNode(nd);
    const m = /^n(\d+)$/.exec(nd.id || '');
    if (m) uid = Math.max(uid, +m[1] + 1);
  });

  edges = (data.edges || [])
    .map(e => ({ id: 'e' + (uid++), from: e.from, to: e.to }))
    .filter(e => getNode(e.from) && getNode(e.to));

  if (data.view && typeof data.view.x === 'number'){
    view = { x: data.view.x, y: data.view.y, s: data.view.s || 1 };
    applyView();
  } else {
    fitView();
  }
  drawEdges();
}

/* ============================================================
   АВТОСОХРАНЕНИЕ
   ============================================================ */
function saveLocal(){
  try { localStorage.setItem(LS_KEY, serialize()); } catch(e){}
}

/* ============================================================
   СТАТУС
   ============================================================ */
let statusTimer = null;
function showStatus(msg){
  statusEl.textContent = msg;
  statusEl.classList.add('show');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => statusEl.classList.remove('show'), 1600);
}

/* ============================================================
   ДЕМО
   ============================================================ */
function demo(){
  const root = addNode({ x: 235, y: 0,   title:'Дерево технологий',
    text:'Корень — нажмите, чтобы изменить', borderColor:'#3b82f6' });
  const a = addNode({ x: 40,  y: 170, title:'Ветка A',
    text:'Описание ветки A', borderColor:'#10b981' });
  const b = addNode({ x: 430, y: 170, title:'Ветка B',
    text:'Описание ветки B', borderColor:'#f59e0b' });
  const c = addNode({ x: 235, y: 330, title:'Ветка C',
    text:'Описание ветки C', borderColor:'#ef4444' });

  edges = [
    { id:'e'+(uid++), from: root.id, to: a.id },
    { id:'e'+(uid++), from: root.id, to: b.id },
    { id:'e'+(uid++), from: a.id,    to: c.id }
  ];
  drawEdges();
  fitView();
}

/* ============================================================
   СТАРТ
   ============================================================ */
(function init(){
  applyView();
  const saved = localStorage.getItem(LS_KEY);
  if (saved){
    try {
      loadProject(JSON.parse(saved));
      return;
    } catch(e){ console.warn('Не удалось восстановить сохранение', e); }
  }
  demo();
})();
</script>
